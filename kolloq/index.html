<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KOLLOQUIUM-TRAINER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#c9c7b3;
    --shell-hi:#dbd9c8;
    --shell-lo:#9a9884;
    --shell-shadow:#5f5d51;
    --bezel:#37363c;
    --bezel-lo:#201f24;
    --screen-0:#9bbc0f;
    --screen-1:#8bac0f;
    --screen-2:#306230;
    --screen-3:#0f380f;
    --maroon:#7a2848;
    --maroon-lo:#551a32;
    --power:#e0483e;
    --normal:#a8a878;
    --poison:#a040a0;
    --electric:#f0c020;
    --fighting:#c03028;
    --psychic:#f85888;
    --water:#6890f0;
    --grass:#78c850;
    --ground:#e0c068;
    --font-pixel:'Press Start 2P', monospace;
    --font-dlg:'VT323', monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% 0%, #4a4a52, #1b1b1f 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-dlg);
    padding:18px 10px 30px;
  }
  .gb{
    width:100%;
    max-width:420px;
    background:linear-gradient(160deg, var(--shell-hi), var(--shell) 40%, var(--shell-lo) 100%);
    border-radius:22px 22px 46px 22px;
    padding:18px 16px 22px;
    box-shadow:0 10px 0 var(--shell-shadow), 0 18px 30px rgba(0,0,0,.55);
    position:relative;
  }
  .gb-top{
    display:flex;align-items:center;gap:8px;
    padding:2px 6px 14px 4px;
  }
  .power-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--power);
    box-shadow:0 0 6px var(--power), inset 0 0 2px #fff5;
  }
  .gb-brand{
    font-family:var(--font-pixel);
    font-size:10px;
    letter-spacing:.5px;
    color:#4a4838;
  }
  .gb-brand span{color:var(--maroon);}

  .bezel{
    background:linear-gradient(160deg,var(--bezel),var(--bezel-lo));
    border-radius:10px 10px 30px 10px;
    padding:14px 12px 18px;
    box-shadow:inset 0 2px 4px #0008, inset 0 -2px 6px #fff2;
  }
  .screen{
    background:var(--screen-0);
    border:3px solid var(--bezel-lo);
    border-radius:3px;
    padding:8px 8px 10px;
    min-height:300px;
    display:flex;
    flex-direction:column;
    position:relative;
    image-rendering:pixelated;
  }
  .screen::after{
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(rgba(15,56,15,.06) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-pixel);
    font-size:8px;
    color:var(--screen-3);
    margin-bottom:8px;
  }
  .badge{
    padding:4px 6px;
    border:2px solid var(--screen-3);
    border-radius:4px;
    background:var(--normal);
    color:#1c1c10;
  }
  .badge[data-cat="Chemie"]{background:var(--poison);color:#fff;}
  .badge[data-cat="Physik"]{background:var(--electric);color:#2a1e00;}
  .counter{opacity:.85;}
  .qcode{
    font-family:var(--font-pixel);
    font-size:8px;
    color:var(--screen-3);
    border:2px solid var(--screen-3);
    border-radius:4px;
    padding:4px 5px;
    opacity:.9;
  }

  .dialogue-wrap{
    flex:1;
    display:flex;flex-direction:column;
    justify-content:space-between;
    gap:6px;
  }
  .dialogue-box{
    border:3px solid var(--screen-3);
    border-radius:4px;
    background:var(--screen-1);
    padding:10px 10px 20px;
    min-height:96px;
    position:relative;
    cursor:pointer;
  }
  .dialogue-text{
    margin:0;
    color:var(--screen-3);
    font-size:16px;
    line-height:1.28;
    white-space:pre-wrap;
    hyphens:auto;
    -webkit-hyphens:auto;
    overflow-wrap:break-word;
  }
  .cursor{
    position:absolute;
    right:10px;bottom:6px;
    color:var(--screen-3);
    font-size:14px;
    opacity:0;
  }
  .cursor.show{opacity:1;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .answer-box{
    border:3px solid var(--screen-3);
    border-radius:4px;
    background:var(--screen-1);
    padding:0 10px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .3s ease, opacity .25s ease, padding .3s ease;
  }
  .answer-box.open{
    padding:8px 10px 10px;
    opacity:1;
  }
  .answer-box ul{margin:0;padding-left:18px;}
  .answer-box li{
    color:var(--screen-3);
    font-size:14px;
    line-height:1.3;
    margin-bottom:4px;
    hyphens:auto;
    -webkit-hyphens:auto;
    overflow-wrap:break-word;
  }
  .answer-box li::marker{content:"♦ ";}

  .caption{
    text-align:center;
    font-family:var(--font-pixel);
    font-size:6px;
    color:var(--screen-3);
    opacity:.55;
    margin-top:6px;
    letter-spacing:.5px;
  }

  .menu-row{
    display:flex;gap:8px;margin-top:12px;
  }
  .gb-btn{
    flex:1;
    font-family:var(--font-pixel);
    font-size:9px;
    color:#f4f1e6;
    background:linear-gradient(180deg, var(--maroon), var(--maroon-lo));
    border:none;
    border-radius:6px;
    padding:12px 6px;
    box-shadow:0 3px 0 #3a1220, 0 5px 8px #0006;
    letter-spacing:.5px;
  }
  .gb-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a1220;}
  .gb-btn.secondary{
    background:linear-gradient(180deg,#5c5c66,#38383f);
    box-shadow:0 3px 0 #1c1c20, 0 5px 8px #0006;
  }
  .gb-btn.secondary:active{box-shadow:0 1px 0 #1c1c20;}

  /* --- controls --- */
  .controls{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;padding:0 6px;
  }
  .dpad{
    position:relative;width:88px;height:88px;
  }
  .dpad-btn{
    position:absolute;
    background:linear-gradient(180deg,#3c3c42,#232327);
    box-shadow:inset 0 1px 1px #fff3, 0 2px 0 #111;
  }
  .dpad-v{left:32px;top:0;width:24px;height:88px;border-radius:5px;}
  .dpad-h{left:0;top:32px;width:88px;height:24px;border-radius:5px;}
  .dpad-center{
    position:absolute;left:32px;top:32px;width:24px;height:24px;
    background:#18181b;border-radius:3px;
  }

  .ab-wrap{
    display:flex;align-items:flex-end;gap:14px;
    transform:rotate(-18deg);
  }
  .round-btn{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(180deg,#9a2a4c,var(--maroon-lo));
    box-shadow:0 4px 0 #3a1220, inset 0 1px 2px #fff4;
    color:#f4f1e6;font-family:var(--font-pixel);font-size:12px;
    border:none;
  }
  .round-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3a1220;}
  .round-btn.b{width:40px;height:40px;font-size:10px;}

  .meta-row{
    display:flex;justify-content:center;gap:26px;margin-top:16px;
  }
  .meta-btn{
    font-family:var(--font-pixel);font-size:7px;color:#4a4838;
    background:linear-gradient(180deg,#b4b29e,#8f8d79);
    border:none;border-radius:10px;
    padding:6px 14px;
    transform:rotate(-18deg);
    box-shadow:0 2px 0 #5f5d51;
  }
  .meta-btn:active{transform:rotate(-18deg) translateY(2px);box-shadow:none;}

  /* --- overlay menu --- */
  .overlay{
    position:absolute;inset:0;
    background:var(--screen-0);
    border:3px solid var(--screen-3);
    display:none;
    flex-direction:column;
    padding:10px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .overlay.open{display:flex;}
  .overlay h3{
    font-family:var(--font-pixel);
    font-size:9px;color:var(--screen-3);
    margin:2px 0 10px;
  }
  .overlay-hint{
    font-family:var(--font-dlg);
    font-size:14px;color:var(--screen-3);
    opacity:.75;
    margin:-4px 0 8px;
  }
  .menu-item{
    font-family:var(--font-dlg);
    font-size:19px;color:var(--screen-3);
    padding:7px 4px;
    border-bottom:2px dotted var(--screen-3);
    display:flex;align-items:center;gap:10px;
    cursor:pointer;
  }
  .menu-item.parent{font-weight:bold;}
  .menu-item.sub{
    padding-left:22px;
    font-size:17px;
    border-bottom:1px dotted color-mix(in srgb, var(--screen-3) 55%, transparent);
  }
  .menu-item.sub .checkbox{width:15px;height:15px;}
  .checkbox{
    flex:none;
    width:18px;height:18px;
    border:2px solid var(--screen-3);
    border-radius:2px;
    background:var(--screen-0);
    position:relative;
  }
  .menu-item.checked .checkbox{background:var(--screen-3);}
  .menu-item.checked .checkbox::after{
    content:"";
    position:absolute;left:3px;top:-1px;
    width:5px;height:9px;
    border-right:3px solid var(--screen-0);
    border-bottom:3px solid var(--screen-0);
    transform:rotate(40deg);
  }
  .menu-item.disabled{opacity:.4;cursor:not-allowed;}
  .overlay-close{
    margin-top:auto;
    align-self:center;
    font-family:var(--font-pixel);
    font-size:9px;
    color:var(--screen-0);
    background:var(--screen-3);
    border:none;border-radius:4px;
    padding:10px 16px;
  }

  @media (max-width:360px){
    .dialogue-text{font-size:14.5px;}
    .answer-box li{font-size:13px;}
  }
</style>
</head>
<body>
<div class="gb">
  <div class="gb-top">
    <div class="power-dot"></div>
    <div class="gb-brand">KOLLOQUIUM <span>★</span> TRAINER</div>
  </div>

  <div class="bezel">
    <div class="screen" id="screen">
      <div class="topbar">
        <span class="badge" id="badge" data-cat="Allgemein">ALLGEMEIN</span>
        <span class="qcode" id="qcode">ALL1</span>
        <span class="counter" id="counter">Karte 1/60</span>
      </div>

      <div class="dialogue-wrap">
        <div class="dialogue-box" id="dialogueBox">
          <p class="dialogue-text" id="questionText"></p>
          <div class="cursor" id="cursor">▼</div>
        </div>

        <div class="answer-box" id="answerBox">
          <ul id="answerList"></ul>
        </div>
      </div>

      <div class="caption">DOT MATRIX &nbsp;·&nbsp; PRÜFUNGS-EDITION</div>

      <div class="overlay" id="overlay">
        <h3>KATEGORIEN</h3>
        <div class="overlay-hint">Mind. 1 Kästchen muss an sein</div>
        <div class="menu-item parent checked" data-group="ALL"><span class="checkbox"></span>ALLGEMEIN (alle)</div>
        <div class="menu-item sub checked" data-key="ALL-Basis"><span class="checkbox"></span>Basis</div>
        <div class="menu-item sub checked" data-key="ALL-U"><span class="checkbox"></span>U · Unterrichten</div>
        <div class="menu-item sub checked" data-key="ALL-E"><span class="checkbox"></span>E · Erziehen</div>
        <div class="menu-item sub checked" data-key="ALL-L"><span class="checkbox"></span>L · Leisten</div>
        <div class="menu-item sub checked" data-key="ALL-B"><span class="checkbox"></span>B · Beraten</div>
        <div class="menu-item sub checked" data-key="ALL-S"><span class="checkbox"></span>S · System Schule</div>
        <div class="menu-item checked" data-key="Chemie"><span class="checkbox"></span>CHEMIE</div>
        <div class="menu-item checked" data-key="Physik"><span class="checkbox"></span>PHYSIK</div>
        <button class="overlay-close" id="overlayClose">▶ FERTIG</button>
      </div>
    </div>
  </div>

  <div class="menu-row">
    <button class="gb-btn" id="actionBtn">▶ ANTWORT ZEIGEN</button>
    <button class="gb-btn secondary" id="skipBtn">B ÜBERSPRINGEN</button>
  </div>

  <div class="controls">
    <div class="dpad">
      <div class="dpad-btn dpad-v"></div>
      <div class="dpad-btn dpad-h"></div>
      <div class="dpad-center"></div>
    </div>
    <div class="ab-wrap">
      <button class="round-btn b" id="btnB">B</button>
      <button class="round-btn" id="btnA">A</button>
    </div>
  </div>

  <div class="meta-row">
    <button class="meta-btn" id="btnSelect">SELECT</button>
    <button class="meta-btn" id="btnStart">START</button>
  </div>
</div>

<script>
const DATA = [
{code:"ALL1",c:"Allgemein",sub:"Basis",q:"Was verstehen Sie unter kompetenzorientiertem Unterricht?",a:["Kompetenzbegriff nach Weinert: Fähigkeiten, Wissen und Bereitschaften zur Bewältigung von Anforderungssituationen","Kernlehrpläne NRW: Output- statt Inputorientierung","Kompetenzbereiche: Sach-, Methoden-, Sozial-, Urteilskompetenz","Handlungsprodukte statt reiner Wissensabfrage, AFB I–III als Progressionslogik"]},
{code:"ALL2",c:"Allgemein",sub:"Basis",q:"Wie gestalten Sie eine binnendifferenzierte Unterrichtsstunde?",a:["Differenzierung nach Umfang, Niveau, Zeit, Hilfestellung (Scaffolding)","Gestufte Lernaufgaben und Wahlaufgaben einsetzen","Diagnostik vor Differenzierung (z. B. Diagnosebögen, Lernstandserhebung)","Rechtlich verankert im Anspruch auf individuelle Förderung (§ 1 SchulG NRW)"]},
{code:"ALL3",c:"Allgemein",sub:"Basis",q:"Welche Rolle spielt der Medienkompetenzrahmen NRW in Ihrem Unterricht?",a:["Verbindliche Grundlage: gemeinsame Vorgabe von Schulministerium und Medienberatung NRW","Sechs Kompetenzbereiche (u. a. Bedienen/Anwenden, Produzieren, Problemlösen)","Integration digitaler Tools fachspezifisch, nicht additiv (z. B. Simulationen, digitale Messwerterfassung)","Medienkritik und Quellenbewertung als fester Bestandteil"]},
{code:"ALL4",c:"Allgemein",sub:"Basis",q:"Wie gehen Sie mit Unterrichtsstörungen um?",a:["Präventiv: durchdachte Unterrichtsgestaltung und Klassenführung","Unterstützend: Feedback, klare Klassenregeln, Schülersprechstunden","Grenzziehend: Androhung von Konsequenzen, Wiedergutmachung, Elterninfo","Pädagogisch/didaktisch-methodisch: direkte Maßnahmen, verbindliche Klassenregeln","Institutionell: kollegiale Fallberatung, Ordnungsmaßnahmen"]},
{code:"ALL5",c:"Allgemein",sub:"Basis",q:"Wie sichern Sie Leistungsbewertung transparent und fair?",a:["Rechtsgrundlage: § 48 SchulG NRW, APO-SI/APO-GOSt, schulinterne Leistungskonzepte","Kriterien vorab transparent machen (Bewertungsraster, Erwartungshorizonte)","Verhältnis schriftliche/sonstige Leistung beachten","Vielfalt der Überprüfungsformen (Tests, Präsentationen, Projekte)"]},
{code:"ALL6",c:"Allgemein",sub:"Basis",q:"Was bedeutet Inklusion für Ihren Fachunterricht?",a:["Recht auf inklusive Bildung im Schulgesetz NRW verankert","Individuelle Förderpläne, Nachteilsausgleich vs. Zieldifferenz","Kooperation mit Sonderpädagog:innen und multiprofessionellen Teams","Universal Design for Learning als Planungsprinzip"]},
{code:"ALL7",c:"Allgemein",sub:"Basis",q:"Wie fördern Sie eine positive Feedback- und Fehlerkultur?",a:["Fehler als Lernchance kommunizieren, kognitive Aktivierung fördern","Feedback zählt laut Hattie zu den wirksamsten Einflussfaktoren auf Lernerfolg","Kriteriengeleitetes, konstruktives Feedback (Sandwich-Prinzip kritisch reflektiert)","Formatives Feedback konsequent von summativer Bewertung trennen"]},
{code:"ALL8",c:"Allgemein",sub:"Basis",q:"Wie beziehen Sie Eltern in den schulischen Prozess ein?",a:["Elternsprechtage, schriftliche Rückmeldungen, digitale Kommunikationswege","Transparenz über Anforderungen und Bewertungsmaßstäbe","Erziehungspartnerschaft statt Einbahnkommunikation","Elternmitwirkung im Rahmen des Schulgesetzes NRW (Klassen-/Schulpflegschaft)"]},
{code:"ALL9",c:"Allgemein",sub:"Basis",q:"Was macht für Sie eine gelungene Unterrichtsstunde aus?",a:["Konkretisierung der Merkmale guten Unterrichts (vgl. Hilbert Meyer) auf eine einzelne Stunde","Klare Lernzielorientierung und roter Faden","Aktivierung aller Schüler:innen, hoher Anteil echter Lernzeit","Reflexionsphase bzw. Sicherung am Stundenende"]},
{code:"ALL10",c:"Allgemein",sub:"Basis",q:"Wie verstehen Sie Ihre Rolle als Lehrkraft und Klassenleitung?",a:["Lernbegleiter:in statt reiner Wissensvermittler:in","Vorbildfunktion, Erziehungsauftrag neben Bildungsauftrag (§ 2 SchulG NRW)","Teamarbeit im Kollegium, Mitgestaltung von Schulentwicklung","Selbstreflexion und kontinuierliche Professionalisierung"]},
{code:"ALL11",c:"Allgemein",sub:"Basis",q:"Wie setzen Sie Lernstandsdiagnostik ein, um Ihren Unterricht zu planen?",a:["Diagnosebögen, Eingangstests, informelle Beobachtung nutzen","Konkrete Fördermaßnahmen aus Diagnoseergebnissen ableiten","Kontinuierliche vs. punktuelle Diagnostik unterscheiden (Lernverlauf im Blick behalten)","Klare Abgrenzung Diagnostik – Bewertung: Diagnostik dient der Förderung, nicht der Note"]},
{code:"ALL12",c:"Allgemein",sub:"Basis",q:"Wie fördern Sie selbstreguliertes Lernen bei Ihren Schüler:innen?",a:["Metakognitive Strategien vermitteln (Planen, Überwachen, Bewerten)","Lerntagebücher und Selbsteinschätzungsbögen einsetzen","Verantwortung schrittweise übergeben (Scaffolding gezielt abbauen)","Wahlmöglichkeiten bei Aufgaben und Lerntempo einräumen"]},
{code:"ALL13",c:"Allgemein",sub:"Basis",q:"Welche Bedeutung hat sprachsensibler Fachunterricht für Sie?",a:["Trennung von Alltags-, Bildungs- und Fachsprache bewusst machen","Sprachliche Hürden bei Textaufgaben und Operatoren mitdenken","Scaffolding-Techniken einsetzen (vgl. Gibbons): Wortspeicher, Formulierungshilfen, Satzmuster","Besondere Relevanz für Schüler:innen mit Deutsch als Zweitsprache"]},
{code:"ALL14",c:"Allgemein",sub:"Basis",q:"Wie gehen Sie mit Heterogenität und Mehrsprachigkeit in der Klasse um?",a:["Heterogenität als Regelfall begreifen, nicht als Ausnahme (Leitlinie Vielfalt NRW)","Ressourcenorientierten statt defizitorientierten Blick auf Mehrsprachigkeit einnehmen","Differenzierte Materialien und flexible Sozialformen einsetzen","Zusammenarbeit mit Sprachförderkräften und Fachkonferenzen suchen"]},
{code:"ALL15",c:"Allgemein",sub:"Basis",q:"Welche Rolle spielt Berufs- und Studienorientierung (StuBo) in Ihrem Fach?",a:["Landesprogramm „Kein Abschluss ohne Anschluss“ (KAoA) als verbindlicher Rahmen","Anknüpfung an MINT-Berufsfelder im Fachunterricht","Zusammenarbeit mit StuBo-Koordination und außerschulischen Partnern","Anwendungsbezüge sichtbar machen (z. B. Praktika, Berufsfelder, Studiengänge)"]},
{code:"ALL16",c:"Allgemein",sub:"Basis",q:"Wie gehen Sie mit Leistungsdruck und Prüfungsangst bei Schüler:innen um?",a:["Transparente Erwartungen und realistische Anforderungen kommunizieren","Fehlerkultur etablieren, die Ängste reduziert statt verstärkt","Übungsformate zur Prüfungsvorbereitung nutzen (z. B. Probeklausuren)","Gespräch suchen, ggf. Beratungslehrkräfte einbinden"]},
{code:"ALL17",c:"Allgemein",sub:"Basis",q:"Wie gestalten Sie die Zusammenarbeit im Kollegium/in der Fachkonferenz?",a:["Mitarbeit an schulinternen Lehrplänen und Leistungskonzepten","Kollegiale Hospitation und Feedback als Professionalisierungsinstrument nutzen","Teamteaching und Materialaustausch pflegen","Konstruktiv mit unterschiedlichen fachdidaktischen Positionen umgehen"]},
{code:"ALL18",c:"Allgemein",sub:"Basis",q:"Wie stehen Sie zur eigenen Fort- und Weiterbildung als Lehrkraft?",a:["Fortbildung als Teil der Dienstpflicht verstehen, nicht als Kür","Regelmäßige Teilnahme an Fachfortbildungen (z. B. Kompetenzteams NRW)","Eigene Unterrichtspraxis kontinuierlich reflektieren und weiterentwickeln","Offenheit für neue fachdidaktische Entwicklungen zeigen (z. B. KI im Unterricht)"]},
{code:"ALL19",c:"Allgemein",sub:"Basis",q:"Wie berücksichtigen Sie Datenschutz beim Einsatz digitaler Medien?",a:["Auswahl datenschutzkonformer, schulisch freigegebener Tools (Dienstgeräte, Schulplattformen)","Keine privaten Accounts/Geräte für dienstliche Zwecke nutzen","Schüler:innen aktiv für Datenschutz im Netz sensibilisieren","Einwilligungen bei Fotos/Videos einholen, DSGVO-konform dokumentieren"]},
{code:"ALL20",c:"Allgemein",sub:"Basis",q:"Wie gehen Sie mit der eigenen Belastung und Selbstfürsorge im Lehrerberuf um?",a:["Realistische Prioritätensetzung und aktives Zeitmanagement","Klare Abgrenzung von Berufs- und Privatleben","Kollegialen Austausch als Unterstützungsressource nutzen","Eigene Rolle reflektieren, um Überforderung frühzeitig vorzubeugen"]},
{code:"ALL21",c:"Allgemein",sub:"Basis",q:"Was unterscheidet geschlossene von offenen Aufgabenformaten?",a:["Geschlossene Aufgaben: vorgegebene Antwortalternativen (Multiple Choice, Zuordnung, Wahr/Falsch), eindeutig auswertbar","Offene Aufgaben: freie Antwortkonstruktion, Bewertung anhand von Kriterienrastern/Erwartungshorizont","Halboffene Formate als Zwischenstufe (Lückentext, Kurzantwort)","Wahl des Formats richtet sich nach Kompetenzziel und angestrebter AFB-Stufe"]},
{code:"ALL22",c:"Allgemein",sub:"Basis",q:"Wann setzen Sie geschlossene Aufgabenformate im Unterricht sinnvoll ein?",a:["Objektive, zeitökonomische Überprüfung von Reproduktionswissen (AFB I)","Gut geeignet für Selbstkontrolle und schnelle Lernstandsdiagnosen","Einsatz in großen Lerngruppen oder digitalen Testformaten sinnvoll","Grenze beachten: geringe Aussagekraft über Transfer- und Urteilskompetenz"]},

let activeKeys = new Set(["Chemie","Physik","ALL-Basis","ALL-U","ALL-E","ALL-L","ALL-B","ALL-S"]);
const BADGE_LABELS = {
  Allgemein:"ALLGEMEIN", Chemie:"CHEMIE", Physik:"PHYSIK"
};
function keyFor(item){
  return item.c === "Allgemein" ? ("ALL-" + item.sub) : item.c;
}
let pool = [];
let currentIndex = -1;
let seen = [];
let typingTimer = null;
let isTyping = false;
let answerShown = false;

const el = {
  badge: document.getElementById('badge'),
  qcode: document.getElementById('qcode'),
  counter: document.getElementById('counter'),
  qText: document.getElementById('questionText'),
  cursor: document.getElementById('cursor'),
  dlgBox: document.getElementById('dialogueBox'),
  answerBox: document.getElementById('answerBox'),
  answerList: document.getElementById('answerList'),
  actionBtn: document.getElementById('actionBtn'),
  skipBtn: document.getElementById('skipBtn'),
  btnA: document.getElementById('btnA'),
  btnB: document.getElementById('btnB'),
  btnStart: document.getElementById('btnStart'),
  btnSelect: document.getElementById('btnSelect'),
  overlay: document.getElementById('overlay'),
};

function buildPool(){
  pool = DATA.map((_,i)=>i).filter(i=>activeKeys.has(keyFor(DATA[i])));
  seen = [];
}

function pickRandomIndex(){
  if(seen.length >= pool.length) seen = [];
  let candidates = pool.filter(i => !seen.includes(i));
  const idx = candidates[Math.floor(Math.random()*candidates.length)];
  seen.push(idx);
  return idx;
}

function typeText(text, done){
  clearInterval(typingTimer);
  el.qText.textContent = "";
  el.cursor.classList.remove('show');
  isTyping = true;
  let i = 0;
  typingTimer = setInterval(()=>{
    el.qText.textContent += text[i];
    i++;
    if(i>=text.length){
      clearInterval(typingTimer);
      isTyping = false;
      el.cursor.classList.add('show');
      if(done) done();
    }
  }, 16);
}

function finishTypingInstantly(){
  clearInterval(typingTimer);
  const q = DATA[currentIndex].q;
  el.qText.textContent = q;
  isTyping = false;
  el.cursor.classList.add('show');
}

function loadQuestion(){
  currentIndex = pickRandomIndex();
  const item = DATA[currentIndex];
  el.badge.textContent = BADGE_LABELS[item.c] || item.c.toUpperCase();
  el.badge.setAttribute('data-cat', item.c);
  el.qcode.textContent = item.code;
  el.counter.textContent = "Karte " + (seen.length) + "/" + pool.length;
  answerShown = false;
  el.answerBox.classList.remove('open');
  el.answerBox.style.maxHeight = "0px";
  el.answerList.innerHTML = "";
  el.actionBtn.textContent = "▶ ANTWORT ZEIGEN";
  typeText(item.q);
}

function showAnswer(){
  const item = DATA[currentIndex];
  el.answerList.innerHTML = "";
  item.a.forEach((line, idx)=>{
    const li = document.createElement('li');
    li.style.opacity = 0;
    li.textContent = line;
    el.answerList.appendChild(li);
    setTimeout(()=>{ li.style.transition="opacity .2s"; li.style.opacity = 1; }, idx*140);
  });
  el.answerBox.classList.add('open');
  // Höhe dynamisch an den tatsächlichen Inhalt anpassen, damit nichts abgeschnitten wird
  requestAnimationFrame(()=>{
    el.answerBox.style.maxHeight = el.answerList.scrollHeight + 40 + "px";
  });
  answerShown = true;
  el.actionBtn.textContent = "▶ NÄCHSTE FRAGE";
}

function primaryAction(){
  if(isTyping){
    finishTypingInstantly();
  } else if(!answerShown){
    showAnswer();
  } else {
    loadQuestion();
  }
}

function skipAction(){
  loadQuestion();
}

el.dlgBox.addEventListener('click', primaryAction);
el.actionBtn.addEventListener('click', primaryAction);
el.btnA.addEventListener('click', primaryAction);
el.skipBtn.addEventListener('click', skipAction);
el.btnB.addEventListener('click', skipAction);

let poolChangedWhileOpen = false;

el.btnStart.addEventListener('click', ()=>{
  el.overlay.classList.toggle('open');
});
document.getElementById('overlayClose').addEventListener('click', ()=>{
  el.overlay.classList.remove('open');
  if(poolChangedWhileOpen){
    buildPool();
    loadQuestion();
    poolChangedWhileOpen = false;
  }
});
el.btnSelect.addEventListener('click', ()=>{
  buildPool();
  loadQuestion();
});

const subItems = document.querySelectorAll('.menu-item.sub');
const parentItem = document.querySelector('.menu-item.parent');

function syncParentVisual(){
  const allChecked = Array.from(subItems).every(s => s.classList.contains('checked'));
  parentItem.classList.toggle('checked', allChecked);
}

parentItem.addEventListener('click', ()=>{
  const turningOn = !parentItem.classList.contains('checked');
  if(!turningOn){
    // Würde alle Basis/U/E/L/B/S-Kästchen abwählen -> nur erlauben, wenn danach noch etwas anderes aktiv bleibt
    const remaining = new Set(activeKeys);
    subItems.forEach(s => remaining.delete(s.getAttribute('data-key')));
    if(remaining.size === 0) return; // mind. 1 Kästchen muss an bleiben
  }
  subItems.forEach(s => {
    const key = s.getAttribute('data-key');
    s.classList.toggle('checked', turningOn);
    if(turningOn) activeKeys.add(key); else activeKeys.delete(key);
  });
  syncParentVisual();
  poolChangedWhileOpen = true;
});

subItems.forEach(item=>{
  item.addEventListener('click', ()=>{
    const key = item.getAttribute('data-key');
    const isChecked = item.classList.contains('checked');
    if(isChecked && activeKeys.size === 1) return; // letztes aktives Kästchen bleibt an
    if(isChecked){ activeKeys.delete(key); item.classList.remove('checked'); }
    else { activeKeys.add(key); item.classList.add('checked'); }
    syncParentVisual();
    poolChangedWhileOpen = true;
  });
});

document.querySelectorAll('.menu-item[data-key="Chemie"], .menu-item[data-key="Physik"]').forEach(item=>{

    if(isChecked){ activeKeys.delete(key); item.classList.remove('checked'); }
    else { activeKeys.add(key); item.classList.add('checked'); }
    poolChangedWhileOpen = true;
  });
});
