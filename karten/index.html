<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Punkte-Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1B4A38 0%, #0E2E22 65%, #0A241B 100%);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom)) 14px;
  }
  #app {
    width: 91%;
    max-width: 437px;
    min-width: 0;
    transform: scale(1.1);
    transform-origin: top center;
  }

  .card {
    background: #12332688;
    backdrop-filter: blur(6px);
    border: 1px solid #C9A15A33;
    border-radius: 16px;
    padding: 22px 18px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .suit-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .suit-icon { color: #C9A15A; font-size: 15px; opacity: 0.7; }
  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    color: #EFE6D3;
    margin: 0 0 4px 0;
  }
  h1.title-small {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    color: #EFE6D3;
    margin: 0;
  }
  p.subtitle { color: #8FA6A0; font-size: 14px; margin: 0 0 20px 0; }
  p.subtitle-small { color: #8FA6A0; font-size: 13px; margin: 2px 0 0 0; }
  label.field-label {
    color: #C9A15A;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: #0E2E2299;
    border: 1px solid #C9A15A44;
    border-radius: 10px;
    padding: 11px 12px;
    color: #EFE6D3;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid #9B3A3466;
    color: #C48A85;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .ghost-btn {
    margin-top: 10px;
    background: transparent;
    border: 1px dashed #C9A15A66;
    color: #C9A15A;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
  }
  .primary-btn {
    margin-top: 22px;
    width: 100%;
    background: linear-gradient(180deg, #D8B570, #C9A15A);
    border: none;
    border-radius: 12px;
    padding: 13px 12px;
    color: #1A2A20;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(201,161,90,0.6);
  }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .player-row { display: flex; gap: 8px; align-items: center; }
  .header-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .table-wrap {
    background: #12332688;
    border: 1px solid #C9A15A33;
    border-radius: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px;
    margin-bottom: 16px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 320px; }
  th.th-round, td.td-round {
    color: #8FA6A0; font-size: 11px; font-weight: 500; padding: 6px 8px; text-align: left;
    position: sticky; left: 0; background: #14352A; z-index: 1;
    box-shadow: 2px 0 4px -2px rgba(0,0,0,0.5);
  }
  th.th { color: #EFE6D3; font-size: 12px; font-weight: 600; padding: 6px 8px; text-align: center; font-family: 'Inter', sans-serif; white-space: nowrap; }
  td.td { color: #EFE6D3; font-size: 13px; padding: 6px 8px; text-align: center; font-family: 'JetBrains Mono', monospace; }
  tr.total-row { border-top: 1px solid #C9A15A55; }
  tr.total-row td.td-round { background: #14352A; }
  td.total-cell { font-weight: 700; font-size: 15px; position: relative; }
  .out-tag { font-size: 9px; color: #C48A85; text-transform: uppercase; letter-spacing: 0.5px; }
  .corr-hint { font-size: 9px; font-weight: 500; font-family: 'Inter', sans-serif; }
  .entry-card { background: #12332688; border: 1px solid #C9A15A33; border-radius: 14px; padding: 14px; }
  .corrections-card { background: #12332688; border: 1px solid #C9A15A33; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  h2.entry-title { font-family: 'Fraunces', serif; color: #EFE6D3; font-size: 17px; margin: 0 0 12px 0; }
  .entry-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; min-width: 0; }
  .entry-name {
    flex: 1 1 auto; min-width: 0; font-family: 'Inter', sans-serif; color: #EFE6D3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rank-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid #C9A15A44; background: transparent;
    color: #C9A15A; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; cursor: pointer;
  }
  .rank-btn.selected {
    background: linear-gradient(180deg, #D8B570, #C9A15A);
    color: #1A2A20; font-weight: 700; border-color: #C9A15A;
  }
  .tie-box { margin-top: 14px; background: #9B3A3422; border: 1px solid #9B3A3455; border-radius: 10px; padding: 10px; }
  .tie-text { color: #E3ABA6; font-size: 13px; margin-bottom: 6px; }
  .stechen-btn {
    background: transparent; border: 1px solid #E3ABA6; color: #E3ABA6;
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
  }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #C9A15A22; }
  .rank-num { color: #C9A15A; font-family: 'JetBrains Mono', monospace; width: 20px; flex-shrink: 0; }
  .rank-hint { color: #C9A15A; font-size: 11px; font-family: 'Inter', sans-serif; width: 46px; text-align: right; flex-shrink: 0; }
  .value-input { flex-shrink: 0; width: 76px !important; padding: 9px 10px !important; text-align: right; font-family: 'JetBrains Mono', monospace; }
  .score-mono { color: #EFE6D3; font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-left: auto; }
  .modal-overlay {
    position: fixed; inset: 0; background: #0A241Bcc;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 10;
  }
  .modal-card {
    background: #12332F; border: 1px solid #C9A15A55; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto;
  }
  .stechen-pick-btn {
    display: flex; align-items: center; gap: 10px;
    background: #0E2E2299; border: 1px solid #C9A15A33; border-radius: 10px;
    padding: 10px 12px; color: #EFE6D3; font-size: 14px; cursor: pointer;
    width: 100%; text-align: left; margin-bottom: 8px;
  }
  .stechen-pick-btn.selected { border-color: #C9A15A; background: #C9A15A22; }
  .corr-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid #C9A15A22;
  }
  .corr-amount { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; margin-left: auto; }
  .step-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid #C9A15A44;
    background: transparent; color: #C9A15A; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .loading-text { text-align: center; color: #8FA6A0; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUITS = ["♠", "♥", "♦", "♣"];
const PALETTE = ["#C9A15A", "#7FA98C", "#B5768A", "#7B93B0", "#C08552", "#8FA6A0"];
const STORAGE_KEY = "kartenspiel-scoreboard-state";

function playerColor(i) { return PALETTE[i % PALETTE.length]; }

let state = {
  loaded: false,
  saveError: false,
  phase: "setup", // setup | game
  deadline: 50,
  playerNames: ["", "", ""],
  players: [],         // {id, name}  (Stammdaten, Werte werden abgeleitet)
  rounds: [],           // [{placements: {id: rank}, values: {id: achieved}}]
  corrections: [],      // [{id, playerId, amount, afterRound}]
  placementsDraft: {},
  valuesDraft: {},       // {id: achievedPoints}
  stechenGroup: null,    // {rank, ids:[...]}
  stechenOrder: [],
  correctionOpen: false,
  correctionPlayerId: null,
  correctionAmount: ""
};

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state = { ...state, ...s, loaded: true, saveError: false };
    } else {
      state.loaded = true;
    }
  } catch (e) {
    state.loaded = true;
  }
  render();
}

function saveState() {
  const { loaded, saveError, saveErrorDetail, ...toSave } = state;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    if (state.saveError) { state.saveError = false; state.saveErrorDetail = null; render(); }
  } catch (e) {
    console.error("Speichern fehlgeschlagen:", e);
    state.saveError = true;
    state.saveErrorDetail = (e && e.message) ? e.message : String(e);
    render();
  }
}

function update(patch, opts = {}) {
  state = { ...state, ...patch };
  if (!opts.skipSave) saveState();
  render();
}

// ---------- Abgeleitete Spielerstände (Runden + Korrekturen chronologisch) ----------
function derivedPlayersFor(rounds, corrections) {
  let players = state.players.map((p) => ({ id: p.id, name: p.name, total: 0, out: false, roundScores: [] }));
  const byPoint = {};
  (corrections || []).forEach((c) => {
    byPoint[c.afterRound] = byPoint[c.afterRound] || [];
    byPoint[c.afterRound].push(c);
  });
  const applyCorrectionsAt = (idx) => {
    (byPoint[idx] || []).forEach((c) => {
      players = players.map((p) => {
        if (p.id !== c.playerId) return p;
        const newTotal = p.total + c.amount;
        return { ...p, total: newTotal, out: newTotal >= state.deadline };
      });
    });
  };
  applyCorrectionsAt(0);
  rounds.forEach((r, idx) => {
    players = players.map((p) => {
      if (p.out) return p;
      const rank = r.placements[p.id];
      if (rank == null) return p;
      const pts = rank - 1;
      const newTotal = p.total + pts;
      return { ...p, total: newTotal, roundScores: [...p.roundScores, pts], out: newTotal >= state.deadline };
    });
    applyCorrectionsAt(idx + 1);
  });
  return players;
}
function derivedPlayers() {
  return derivedPlayersFor(state.rounds, state.corrections);
}
function correctionsSumFor(pid) {
  return state.corrections.filter((c) => c.playerId === pid).reduce((s, c) => s + c.amount, 0);
}

// ---------- Setup actions ----------
function addPlayerField() {
  const names = readPlayerNamesFromDOM();
  if (names.length >= 8) return;
  update({ playerNames: [...names, ""] });
}
function removePlayerField(idx) {
  const names = readPlayerNamesFromDOM();
  if (names.length <= 2) return;
  update({ playerNames: names.filter((_, i) => i !== idx) });
}
function readPlayerNamesFromDOM() {
  const inputs = document.querySelectorAll(".player-name-input");
  if (inputs.length === 0) return state.playerNames;
  return Array.from(inputs).map((i) => i.value);
}
function readDeadlineFromDOM() {
  const el = document.getElementById("deadline-input");
  return el ? Number(el.value) : state.deadline;
}

function startGame() {
  const names = readPlayerNamesFromDOM().map((n) => n.trim()).filter(Boolean);
  const deadline = readDeadlineFromDOM();
  if (names.length < 2) return;
  const initial = names.map((name, i) => ({ id: i, name }));
  const draft = {};
  const values = {};
  initial.forEach((p) => { draft[p.id] = null; values[p.id] = ""; });
  update({
    phase: "game", players: initial, deadline, rounds: [], corrections: [],
    placementsDraft: draft, valuesDraft: values, stechenGroup: null, stechenOrder: [],
    correctionOpen: false, correctionPlayerId: null, correctionAmount: ""
  });
}

function resetGame() {
  update({
    phase: "setup", players: [], rounds: [], corrections: [],
    placementsDraft: {}, valuesDraft: {}, stechenGroup: null, stechenOrder: [],
    correctionOpen: false, correctionPlayerId: null, correctionAmount: ""
  });
}

function confirmReset() {
  if (window.confirm("Wirklich alles zurücksetzen? Der gesamte Spielstand geht dabei verloren.")) {
    resetGame();
  }
}

// ---------- Game actions ----------
function computePlacementsFromValues(values, activeIds) {
  const entries = activeIds
    .filter((id) => values[id] !== "" && values[id] != null && !isNaN(Number(values[id])))
    .map((id) => ({ id, val: Number(values[id]) }));
  entries.sort((a, b) => b.val - a.val); // in Schwimmen gewinnt der höchste Wert
  const placements = {};
  let rank = 1;
  for (let i = 0; i < entries.length; i++) {
    if (i > 0 && entries[i].val === entries[i - 1].val) {
      placements[entries[i].id] = placements[entries[i - 1].id];
    } else {
      placements[entries[i].id] = rank;
    }
    rank++;
  }
  return placements;
}

function setRoundValue(id, rawValue) {
  const values = { ...state.valuesDraft, [id]: rawValue };
  const active = derivedPlayers().filter((p) => !p.out).map((p) => p.id);
  const placements = computePlacementsFromValues(values, active);
  active.forEach((pid) => { if (!(pid in placements)) placements[pid] = null; });
  update({ valuesDraft: values, placementsDraft: placements, stechenGroup: null, stechenOrder: [] });
}

function computeTieGroups(draft) {
  const byRank = {};
  Object.entries(draft).forEach(([id, rank]) => {
    if (rank == null) return;
    byRank[rank] = byRank[rank] || [];
    byRank[rank].push(Number(id));
  });
  return Object.entries(byRank).filter(([, ids]) => ids.length > 1).map(([rank, ids]) => ({ rank: Number(rank), ids }));
}

function beginStechen(rank, ids) {
  update({ stechenGroup: { rank, ids }, stechenOrder: [] });
}

function pickStechenPlayer(id) {
  if (state.stechenOrder.includes(id)) return;
  const next = [...state.stechenOrder, id];
  if (next.length === state.stechenGroup.ids.length) {
    const draft = { ...state.placementsDraft };
    next.forEach((pid, i) => { draft[pid] = state.stechenGroup.rank + i; });
    const usedRanks = [...new Set(Object.values(draft).filter((r) => r != null))].sort((a, b) => a - b);
    const remap = {};
    usedRanks.forEach((r, i) => (remap[r] = i + 1));
    Object.keys(draft).forEach((k) => { draft[k] = remap[draft[k]]; });
    update({ placementsDraft: draft, stechenGroup: null, stechenOrder: [] });
  } else {
    update({ stechenOrder: next });
  }
}

function undoStechenPick() {
  if (!state.stechenGroup || state.stechenOrder.length === 0) return;
  update({ stechenOrder: state.stechenOrder.slice(0, -1) });
}

function undoLastRound() {
  if (state.rounds.length === 0) return;
  const newRounds = state.rounds.slice(0, -1);
  // Korrekturen, die erst nach der jetzt entfernten Runde erfasst wurden, fallen mit weg
  const newCorrections = state.corrections.filter((c) => c.afterRound <= newRounds.length);
  const newDerived = derivedPlayersFor(newRounds, newCorrections);
  const draft = {};
  const values = {};
  newDerived.filter((p) => !p.out).forEach((p) => { draft[p.id] = null; values[p.id] = ""; });
  update({ rounds: newRounds, corrections: newCorrections, placementsDraft: draft, valuesDraft: values, stechenGroup: null, stechenOrder: [] });
}

function submitRound() {
  const active = derivedPlayers().filter((p) => !p.out);
  const allAssigned = active.every((p) => state.placementsDraft[p.id] != null);
  const tieGroups = computeTieGroups(state.placementsDraft);
  if (!allAssigned || tieGroups.length > 0) return;

  const roundPlacements = {};
  const roundValues = {};
  active.forEach((p) => {
    roundPlacements[p.id] = state.placementsDraft[p.id];
    roundValues[p.id] = state.valuesDraft[p.id];
  });
  const newRounds = [...state.rounds, { placements: roundPlacements, values: roundValues }];
  const newDerived = derivedPlayersFor(newRounds, state.corrections);
  const draft = {};
  const values = {};
  newDerived.filter((p) => !p.out).forEach((p) => { draft[p.id] = null; values[p.id] = ""; });
  update({ rounds: newRounds, placementsDraft: draft, valuesDraft: values });
}

// ---------- Korrektur ----------
function openCorrection() {
  update({ correctionOpen: true, correctionPlayerId: null, correctionAmount: "" });
}
function closeCorrection() {
  update({ correctionOpen: false, correctionPlayerId: null, correctionAmount: "" });
}
function selectCorrectionPlayer(id) {
  update({ correctionPlayerId: id });
}
function setCorrectionAmount(raw) {
  update({ correctionAmount: raw });
}
function stepCorrectionAmount(delta) {
  const current = Number(state.correctionAmount) || 0;
  update({ correctionAmount: String(current + delta) });
}
function applyCorrection() {
  const amount = Number(state.correctionAmount);
  if (state.correctionPlayerId == null || !amount || isNaN(amount)) return;
  const correction = {
    id: "c" + Date.now() + Math.random().toString(36).slice(2, 7),
    playerId: state.correctionPlayerId,
    amount,
    afterRound: state.rounds.length
  };
  update({ corrections: [...state.corrections, correction], correctionOpen: false, correctionPlayerId: null, correctionAmount: "" });
}
function removeCorrection(id) {
  update({ corrections: state.corrections.filter((c) => c.id !== id) });
}

// ---------- Rendering ----------
function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = renderLoading(); return; }

  const activeEl = document.activeElement;
  let restore = null;
  if (activeEl && activeEl.dataset && activeEl.dataset.focusId) {
    restore = { id: activeEl.dataset.focusId, start: activeEl.selectionStart, end: activeEl.selectionEnd };
  }

  const derived = derivedPlayers();
  const eliminatedCount = derived.filter((p) => p.out).length;
  const gameOver = eliminatedCount >= 2 && state.rounds.length > 0;

  if (state.phase === "setup") { app.innerHTML = renderSetup(); attachSetupHandlers(); }
  else if (gameOver) { app.innerHTML = renderGameOver(derived); attachGameOverHandlers(); }
  else { app.innerHTML = renderGame(derived); attachGameHandlers(); }

  if (restore) {
    const el = app.querySelector(`[data-focus-id="${restore.id}"]`);
    if (el) {
      el.focus();
      if (el.setSelectionRange && restore.start != null) {
        try { el.setSelectionRange(restore.start, restore.end); } catch (e) {}
      }
    }
  }
}

function renderLoading() {
  return `<div class="card loading-text">Lade Spielstand …</div>`;
}

function renderSetup() {
  const suits = SUITS.map((s) => `<span class="suit-icon">${s}</span>`).join("");
  const playerRows = state.playerNames.map((name, i) => `
    <div class="player-row" style="margin-bottom:8px;">
      <span class="dot" style="background:${playerColor(i)}; box-shadow:0 0 8px ${playerColor(i)}88;"></span>
      <input type="text" class="player-name-input" data-focus-id="name-${i}" placeholder="Spieler ${i + 1}" value="${escapeHtml(name)}" style="flex:1;" />
      ${state.playerNames.length > 2 ? `<button class="icon-btn" data-remove="${i}">✕</button>` : ""}
    </div>
  `).join("");

  return `
    <div class="card">
      <div class="suit-row">${suits}</div>
      <h1 class="title">Punkte-Board</h1>
      <p class="subtitle">Spiel endet, sobald 2 Spieler die Deadline erreicht haben.</p>

      <label class="field-label">Ausscheiden ab (Deadline)</label>
      <input type="number" id="deadline-input" data-focus-id="deadline" value="${state.deadline}" />

      <label class="field-label" style="margin-top:20px;">Spieler</label>
      <div>${playerRows}</div>
      <button class="ghost-btn" id="add-player-btn">+ Spieler hinzufügen</button>

      <button class="primary-btn" id="start-btn">Spiel starten</button>
    </div>
  `;
}

function attachSetupHandlers() {
  document.getElementById("add-player-btn").onclick = addPlayerField;
  document.getElementById("start-btn").onclick = startGame;
  document.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.onclick = () => removePlayerField(Number(btn.dataset.remove));
  });
}

function renderGameOver(derived) {
  const ranking = [...derived].sort((a, b) => {
    if (a.out !== b.out) return a.out ? 1 : -1;
    return a.total - b.total;
  });
  const winner = ranking[0];
  const stillIn = derived.filter((p) => !p.out);
  const soleWinner = stillIn.length === 1;
  const suits = SUITS.map((s) => `<span class="suit-icon">${s}</span>`).join("");

  const rows = ranking.map((p, i) => {
    const corr = correctionsSumFor(p.id);
    return `
    <div class="rank-row">
      <span class="rank-num">${i + 1}.</span>
      <span class="dot" style="background:${playerColor(p.id)}; box-shadow:0 0 8px ${playerColor(p.id)}88;"></span>
      <span style="flex:1; min-width:0; font-family:'Inter',sans-serif; color:#EFE6D3; overflow-wrap:break-word;">
        ${escapeHtml(p.name)} ${p.out ? `<em style="color:#C48A85; font-style:normal; font-size:12px;">ausgeschieden</em>` : ""}
        ${corr !== 0 ? `<span style="color:${corr > 0 ? "#E3ABA6" : "#7FA98C"}; font-size:11px;"> (Korr. ${corr > 0 ? "+" : ""}${corr})</span>` : ""}
      </span>
      <span class="score-mono">${p.total}</span>
    </div>
  `;
  }).join("");

  return `
    <div class="card">
      <div class="suit-row">${suits}</div>
      <h1 class="title">${soleWinner ? `${escapeHtml(winner.name)} gewinnt!` : "2 Spieler ausgeschieden"}</h1>
      <p class="subtitle">${soleWinner ? `Endstand nach ${state.rounds.length} Runden` : `Bestplatzierter: ${escapeHtml(winner.name)} · nach ${state.rounds.length} Runden`}</p>
      <div style="margin-top:12px;">${rows}</div>
      <button class="primary-btn" id="new-game-btn">Neues Spiel</button>
    </div>
  `;
}

function attachGameOverHandlers() {
  document.getElementById("new-game-btn").onclick = resetGame;
}

function renderGame(derived) {
  const active = derived.filter((p) => !p.out);
  const allAssigned = active.every((p) => state.placementsDraft[p.id] != null);
  const tieGroups = computeTieGroups(state.placementsDraft);

  const headerCells = derived.map((p) => `
    <th class="th" style="opacity:${p.out ? 0.4 : 1};">
      <span class="dot" style="background:${playerColor(p.id)}; box-shadow:0 0 8px ${playerColor(p.id)}88;"></span>
      <div>${escapeHtml(p.name)}</div>
    </th>
  `).join("");

  const roundRows = state.rounds.map((r, ri) => {
    const cells = derived.map((p) => `
      <td class="td">${r.placements[p.id] != null ? p.roundScores[ri] : "–"}</td>
    `).join("");
    return `<tr><td class="td-round">${ri + 1}</td>${cells}</tr>`;
  }).join("");

  const totalCells = derived.map((p) => {
    const corr = correctionsSumFor(p.id);
    return `
    <td class="td total-cell" style="color:${p.out ? "#C48A85" : "#EFE6D3"};">
      ${p.total}
      ${p.out ? `<div class="out-tag">raus</div>` : ""}
      ${corr !== 0 ? `<div class="corr-hint" style="color:${corr > 0 ? "#E3ABA6" : "#7FA98C"};">Korr. ${corr > 0 ? "+" : ""}${corr}</div>` : ""}
    </td>
  `;
  }).join("");

  const entryRows = active.map((p) => {
    const rank = state.placementsDraft[p.id];
    return `
      <div class="entry-row">
        <span class="dot" style="background:${playerColor(p.id)}; box-shadow:0 0 8px ${playerColor(p.id)}88;"></span>
        <span class="entry-name">${escapeHtml(p.name)}</span>
        <input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" class="value-input" data-focus-id="value-${p.id}" data-pid="${p.id}"
          placeholder="Punkte" value="${state.valuesDraft[p.id] ?? ""}" />
        <span class="rank-hint">${rank != null ? "Platz " + rank : ""}</span>
      </div>
    `;
  }).join("");

  const tieBox = tieGroups.length > 0 ? `
    <div class="tie-box">
      ${tieGroups.map((g) => `
        <div style="margin-bottom:8px;">
          <div class="tie-text">Gleichstand auf Platz ${g.rank}: ${g.ids.map((id) => escapeHtml(derived.find((p) => p.id === id).name)).join(" & ")} — Stechen nötig</div>
          <button class="stechen-btn" data-stechen-rank="${g.rank}" data-stechen-ids="${g.ids.join(",")}">Stechen starten</button>
        </div>
      `).join("")}
    </div>
  ` : "";

  const canSubmit = allAssigned && tieGroups.length === 0;

  const correctionsCard = state.corrections.length > 0 ? `
    <div class="corrections-card">
      <h2 class="entry-title">Korrekturen</h2>
      ${state.corrections.map((c) => {
        const p = derived.find((pp) => pp.id === c.playerId);
        return `
          <div class="corr-row">
            <span class="dot" style="background:${playerColor(c.playerId)}; box-shadow:0 0 8px ${playerColor(c.playerId)}88;"></span>
            <span class="entry-name">${p ? escapeHtml(p.name) : "?"}</span>
            <span class="corr-amount" style="color:${c.amount > 0 ? "#E3ABA6" : "#7FA98C"};">${c.amount > 0 ? "+" : ""}${c.amount}</span>
            <button class="icon-btn" data-remove-corr="${c.id}" title="Korrektur entfernen" style="width:28px; height:28px;">✕</button>
          </div>
        `;
      }).join("")}
    </div>
  ` : "";

  const stechenModal = state.stechenGroup ? `
    <div class="modal-overlay" id="stechen-overlay">
      <div class="modal-card">
        <h2 class="entry-title">Stechen – Reihenfolge festlegen</h2>
        <p class="subtitle-small">Tippe die Spieler in der Reihenfolge an, in der sie das Stechen beendet haben (beste zuerst).</p>
        <div style="margin-top:12px;">
          ${state.stechenGroup.ids.filter((id) => !state.stechenOrder.includes(id)).map((id) => {
            const p = derived.find((pp) => pp.id === id);
            return `<button class="stechen-pick-btn" data-pick="${id}">
              <span class="dot" style="background:${playerColor(id)}; box-shadow:0 0 8px ${playerColor(id)}88;"></span>
              ${escapeHtml(p.name)}
            </button>`;
          }).join("")}
        </div>
        ${state.stechenOrder.length > 0 ? `
          <div style="margin-top:12px; font-size:13px; color:#8FA6A0; font-family:'Inter',sans-serif;">
            Bereits gewählt: ${state.stechenOrder.map((id) => escapeHtml(derived.find((p) => p.id === id).name)).join(" → ")}
          </div>
          <button class="ghost-btn" id="undo-stechen-btn" style="margin-top:12px;">↺ Letzte Auswahl rückgängig</button>` : ""}
      </div>
    </div>
  ` : "";

  const correctionModal = state.correctionOpen ? `
    <div class="modal-overlay" id="correction-overlay">
      <div class="modal-card">
        <h2 class="entry-title">Korrektur</h2>
        <p class="subtitle-small">Spieler auswählen und Punkte manuell hinzufügen oder abziehen.</p>
        <div style="margin-top:12px;">
          ${derived.map((p) => `
            <button class="stechen-pick-btn ${state.correctionPlayerId === p.id ? "selected" : ""}" data-corr-player="${p.id}">
              <span class="dot" style="background:${playerColor(p.id)}; box-shadow:0 0 8px ${playerColor(p.id)}88;"></span>
              ${escapeHtml(p.name)}
            </button>
          `).join("")}
        </div>
        <label class="field-label" style="margin-top:14px;">Punkte (+ oder −)</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="step-btn" id="corr-minus">−1</button>
          <input type="text" inputmode="numeric" pattern="-?[0-9]*" id="correction-amount-input" data-focus-id="correction-amount"
            placeholder="z. B. -3" value="${state.correctionAmount}" style="text-align:center;" />
          <button class="step-btn" id="corr-plus">+1</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button class="ghost-btn" id="correction-cancel" style="margin-top:0;">Abbrechen</button>
          <button class="primary-btn" id="correction-apply" style="margin-top:0;" ${(state.correctionPlayerId == null || !Number(state.correctionAmount)) ? "disabled" : ""}>Anwenden</button>
        </div>
      </div>
    </div>
  ` : "";

  return `
    <div class="header-bar">
      <div>
        <h1 class="title-small">Punkte-Board</h1>
        <p class="subtitle-small">Deadline: ${state.deadline} · Runde ${state.rounds.length + 1}</p>
        ${state.saveError ? `<p class="subtitle-small" style="color:#E3ABA6;">Speichern fehlgeschlagen: ${escapeHtml(state.saveErrorDetail || "unbekannter Fehler")}</p>` : ""}
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="correction-btn" title="Korrektur" style="width:auto; height:36px; padding:0 12px; font-size:12px; color:#C9A15A; border-color:#C9A15A66;">✎ Korrektur</button>
        <button class="icon-btn" id="reset-btn" title="Zurücksetzen" style="width:auto; height:36px; padding:0 12px; font-size:12px;">⟲ Reset</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th class="th-round">Runde</th>${headerCells}</tr></thead>
        <tbody>
          ${roundRows}
          <tr class="total-row"><td class="td-round">Σ</td>${totalCells}</tr>
        </tbody>
      </table>
    </div>

    ${correctionsCard}

    <div class="entry-card">
      <h2 class="entry-title">Erreichte Punkte dieser Runde</h2>
      <div>${entryRows}</div>
      ${tieBox}
      <div style="display:flex; gap:8px; margin-top:22px;">
        <button class="ghost-btn" id="undo-round-btn" ${state.rounds.length === 0 ? "disabled" : ""} style="margin-top:0; width:auto; flex-shrink:0; opacity:${state.rounds.length === 0 ? 0.35 : 1}; cursor:${state.rounds.length === 0 ? "not-allowed" : "pointer"};">↺ Rückgängig</button>
        <button class="primary-btn" id="submit-round-btn" ${canSubmit ? "" : "disabled"} style="margin-top:0; flex:1;">Runde eintragen</button>
      </div>
    </div>

    ${stechenModal}
    ${correctionModal}
  `;
}

function attachGameHandlers() {
  const resetBtn = document.getElementById("reset-btn");
  if (resetBtn) resetBtn.onclick = confirmReset;

  const correctionBtn = document.getElementById("correction-btn");
  if (correctionBtn) correctionBtn.onclick = openCorrection;

  document.querySelectorAll(".value-input").forEach((input) => {
    input.oninput = () => setRoundValue(Number(input.dataset.pid), input.value);
  });
  document.querySelectorAll("[data-stechen-rank]").forEach((btn) => {
    btn.onclick = () => beginStechen(Number(btn.dataset.stechenRank), btn.dataset.stechenIds.split(",").map(Number));
  });
  const submitBtn = document.getElementById("submit-round-btn");
  if (submitBtn) submitBtn.onclick = submitRound;
  const undoBtn = document.getElementById("undo-round-btn");
  if (undoBtn) undoBtn.onclick = undoLastRound;
  document.querySelectorAll("[data-pick]").forEach((btn) => {
    btn.onclick = () => pickStechenPlayer(Number(btn.dataset.pick));
  });
  const undoStechenBtn = document.getElementById("undo-stechen-btn");
  if (undoStechenBtn) undoStechenBtn.onclick = undoStechenPick;

  document.querySelectorAll("[data-remove-corr]").forEach((btn) => {
    btn.onclick = () => removeCorrection(btn.dataset.removeCorr);
  });

  document.querySelectorAll("[data-corr-player]").forEach((btn) => {
    btn.onclick = () => selectCorrectionPlayer(Number(btn.dataset.corrPlayer));
  });
  const amountInput = document.getElementById("correction-amount-input");
  if (amountInput) amountInput.oninput = () => setCorrectionAmount(amountInput.value);
  const minusBtn = document.getElementById("corr-minus");
  if (minusBtn) minusBtn.onclick = () => stepCorrectionAmount(-1);
  const plusBtn = document.getElementById("corr-plus");
  if (plusBtn) plusBtn.onclick = () => stepCorrectionAmount(1);
  const cancelBtn = document.getElementById("correction-cancel");
  if (cancelBtn) cancelBtn.onclick = closeCorrection;
  const applyBtn = document.getElementById("correction-apply");
  if (applyBtn) applyBtn.onclick = applyCorrection;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

loadState();
</script>
</body>
</html>
