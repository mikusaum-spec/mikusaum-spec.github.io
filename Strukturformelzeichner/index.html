<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewis-Zeichner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhiges, sachliches Werkzeug für den Chemieunterricht
   IDEA: ein weißes Zeichenblatt aus dem Arbeitsheft
   PICTURE: das Blatt selbst mit dem Molekül, füllt den Bildschirm
   COLOUR and TYPE: Chemie-Orange als Akzent, Tinte auf Weiß; Source Sans 3
   LAYOUT: Werkzeuge oben, Blatt in der Mitte, Formel und Prüfung unten */
:root{color-scheme:light dark;--bg:light-dark(#f3efe9,#1b1a19);--ink:light-dark(#1d1b19,#ece8e3);--mut:light-dark(#6b645c,#a59d94);--line:light-dark(#d9d2c8,#3d3935);--btn:light-dark(#fff,#272523);--acc:#e2730b;--err:#d22d1f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow-x:clip;overflow-y:auto}
header{display:flex;align-items:baseline;gap:12px;padding:10px max(2vw,12px) 2px;flex-wrap:wrap}
h1{font-size:24px;margin:0;line-height:1.1}
header .sub{color:var(--mut);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:5px max(2vw,12px);align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border:0}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg button:last-child{border-radius:0 10px 10px 0}
.lab{font-size:13px;color:var(--mut);margin-right:2px}
button{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:10px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.35;cursor:default}
.pal button{font-weight:700;font-size:17px;padding:0 6px}
.pal button.m{font-weight:600}
.pal button.on{color:#fff}
.board{flex:1 1 320px;position:relative;margin:4px max(2vw,12px);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 28px rgb(0 0 0 / .09)}
#sv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:12px;bottom:9px;right:12px;font-size:13px;color:#7a7168;pointer-events:none}
footer{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:4px max(2vw,12px) 10px;font-size:15px}
#fo{font-size:19px;font-weight:600}
#pr{color:#2f7d32}#pr.bad{color:var(--err)}
#tn{color:var(--mut);font-size:13px}
.opt{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.opt button{min-height:40px;font-size:14px}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.show{display:flex}
.card{background:var(--btn);color:var(--ink);border-radius:14px;padding:18px;max-width:600px;width:100%;max-height:92vh;overflow:auto}
.card img{max-width:100%;max-height:52vh;display:block;margin:12px auto;background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card p{margin:6px 0 12px;font-size:14px;color:var(--mut)}
.mobOnly{display:none}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .4);display:none;align-items:flex-end;z-index:6}.sheet.show{display:flex}
.sheetIn{background:var(--bg);width:100%;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
#shBody .grp,#shBody .opt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;border:0}#shBody button{min-height:44px}
body.mob .mobOnly{display:flex}body.mob .pal .lab{display:none}body.mob header{display:none}
body.mob .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 8px;gap:4px}body.mob .bar::-webkit-scrollbar{display:none}
body.mob .bar .grp{flex:none;flex-wrap:nowrap;border:0;padding:0}body.mob .bar button{flex:none;min-height:40px;min-width:40px;font-size:14px;padding:0 10px}
body.mob .board{margin:2px 6px;border-radius:10px}body.mob .hint{font-size:12px;left:8px;bottom:6px}
body.mob footer{display:grid;gap:0;padding:3px 10px calc(6px + env(safe-area-inset-bottom))}
body.mob #fo{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.mob #pr{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.mob #tn{display:none}
</style>
</head>
<body>
<header><h1>Lewis-Zeichner</h1><span class="sub">Valenzstrichformeln mit freien Elektronenpaaren und VSEPR-Winkeln</span></header>
<div class="bar" id="bar1">
  <div class="grp mobOnly"><button id="bMore">☰ Mehr</button></div>
  <div class="grp"><button id="bU" aria-label="Rückgängig" title="Rückgängig">↶</button><button id="bR" aria-label="Wiederholen" title="Wiederholen">↷</button><button id="bF" title="Alles ins Bild holen">Einpassen</button></div>
  <div class="grp" id="tools">
    <button data-t="draw" class="on">Zeichnen</button>
    <button data-t="swap">Element tauschen</button>
    <button data-t="move">Verschieben</button>
    <button data-t="hand">Hand (Drehen)</button>

    <button data-t="qm">Ladung −</button>
    <button data-t="del">Löschen</button>
  </div>
  <div class="grp" id="acts">

    <button id="bG">Gerade ausrichten</button>
    <button id="bA">VSEPR-Winkel</button>
    <button id="bB">Benzolring</button>
    <button id="bC">Leeren</button>
    <span class="seg" id="bM"><button data-m="lewis">Lewis</button><button data-m="half">Halbstruktur</button><button data-m="skel">Skelett</button></span>
    <button id="bN">IUPAC-Name</button>
    <button id="bP" class="on">PNG</button>
  </div>
</div>
<div class="bar pal" id="pal"></div>
<main class="board"><svg id="sv" aria-label="Zeichenfläche"></svg><div class="hint" id="hint"></div></main>
<footer id="foot">
  <span id="fo"></span><span id="pr"></span><span id="tn"></span>
  <span class="opt" id="opts">
    <button id="oL">Paare: Striche</button>
    <button id="oW">Winkel</button>
    <button id="oO">Oktett-Prüfung</button>
    <button id="oF">Farbig</button>
  </span>
</footer>
<div class="sheet" id="sh"><div class="sheetIn"><div class="row" style="justify-content:space-between"><b>Weitere Funktionen</b><button id="shx">Schließen</button></div><div id="shBody"></div></div></div>
<div class="modal" id="md"><div class="card">
  <div class="row" style="justify-content:space-between"><b>PNG-Export</b><button id="mx">Schließen</button></div>
  <img id="mi" alt="Exportiertes Molekül">
  <p id="mm"></p>
  <div class="row"><button id="md2" class="on">Herunterladen</button><button id="mc">In Zwischenablage kopieren</button><button id="mt">Hintergrund: weiß</button></div>
</div></div>
<script>
{
const EL={H:[1,'#5a5a5a',1.008],B:[3,'#b5651d',10.81],C:[4,'#111111',12.011],N:[5,'#1f4fd1',14.007],O:[6,'#d8261c',15.999],F:[7,'#1c8a3c',18.998],Na:[1,'#6b4fbb',22.990],Mg:[2,'#2e7d5b',24.305],Al:[3,'#7a7f86',26.982],P:[5,'#d9730d',30.974],S:[6,'#a88400',32.06],Cl:[7,'#1c8a3c',35.45],K:[1,'#6b4fbb',39.098],Ca:[2,'#2e7d5b',40.078],Br:[7,'#8a2a12',79.904],I:[7,'#6b2c91',126.904]};
const MET=new Set(['Na','K','Mg','Ca','Al']),EXP=new Set(['P','S','Cl','Br','I']);
const PAL=['H','C','N','O','S','P','F','Cl','Br','I','B','Na','K','Mg','Ca','Al'];
const L=60,FONT='Arial,Helvetica,sans-serif',INK='#1d1b19',ACC='#e2730b',KEY='lewis-zeichner-1';
const HINTS={draw:'Leere Fläche antippen: Atom setzen · Von einem Atom ziehen: Bindung · Atom antippen: durch gewähltes Element ersetzen (gleiches Element: Nachbaratom anhängen) · Bindung antippen: einfach → doppelt → dreifach',swap:'Atom antippen: wird zum gewählten Element · Bindung antippen: Bindungsordnung ändern',move:'Atom ziehen: verschieben · Leere Fläche ziehen: Ansicht verschieben · Zwei Finger: zoomen',hand:'Bindung oder Endatom ziehen: dreht diesen Molekülteil um das Nachbaratom (15°-Schritte), Bindungslänge bleibt gleich',qp:'Atom antippen: Ladung um +1 erhöhen',qm:'Atom antippen: Ladung um −1 verringern',del:'Atom oder Bindung antippen: löschen'};
let S={atoms:[],bonds:[],n:1},O={lp:'bar',ang:true,chk:true,col:false,tr:false,nm:false,mode:'lewis'};
let V={s:1,x:0,y:0},pinch=null;const pts=new Map(),clampS=v=>Math.max(.25,Math.min(4,v));
let tool='draw',sel='C',U=[],R=[],drag=null,prev=null,exNote=false,blobUrl=null,lastBlob=null,ht=null;
const $=id=>document.getElementById(id),sv=$('sv');
const rad=d=>d*Math.PI/180,nrm=d=>((d%360)+360)%360,F=n=>Math.round(n*10)/10;
const adiff=(a,b)=>{const d=Math.abs(nrm(a)-nrm(b));return d>180?360-d:d};
const A=id=>S.atoms.find(a=>a.id===id);
const nb=a=>S.bonds.filter(b=>b.a===a.id||b.b===a.id).map(b=>({b,o:A(b.a===a.id?b.b:b.a)}));
const ang=(p,q)=>nrm(Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI);
const pol=(a,d,r)=>({x:a.x+r*Math.cos(rad(d)),y:a.y+r*Math.sin(rad(d))});

function info(a){const ns=nb(a);const bs=ns.reduce((s,n)=>s+n.b.o,0);const f=EL[a.el][0]-a.q-bs;let p=f>0?Math.floor(f/2):0,r=f>0?f%2:0;if(!ns.length&&f>0){p=Math.max(0,f-4);r=f-2*p}return{ns,bs,f,p,r,k:p+r,n:ns.length}}

/* VSEPR: relative Richtungen der Bindungen je nach Zahl der Bindungspartner (n) und freien Elektronenpaare (k) */
function idealRel(n,k){if(n<=1)return[0];if(n+k<=4){if(n===2)return k===0?[0,180]:k===1?[0,120]:[0,104.5];if(n===3)return k===0?[0,120,240]:[0,107,214];if(n===4)return[0,90,180,270]}return[...Array(n)].map((_,i)=>i*360/n)}
function greedy(items,slots,used){let c=0;const pick=[];for(const it of items){let bi=-1,bd=1e9;slots.forEach((s,i)=>{if(!used.has(i)){const d=adiff(it,s);if(d<bd){bd=d;bi=i}}});if(bi<0){pick.push(null);continue}used.add(bi);c+=bd*bd;pick.push(slots[bi])}return[c,pick]}
function fit(fixed,free,n,k){const rel=idealRel(n,k),cands=[],anchors=fixed.length?fixed:free.length?free:[0];
  for(const an of anchors)for(let j=0;j<rel.length;j++)for(const m of[1,-1])cands.push(rel.map(r=>nrm(an+m*(r-rel[j]))));
  if(!fixed.length&&free.length>1){const cm=a=>Math.atan2(a.reduce((s,v)=>s+Math.sin(rad(v)),0),a.reduce((s,v)=>s+Math.cos(rad(v)),0))*180/Math.PI;for(const m of[1,-1]){const r2=rel.map(r=>m*r),off=cm(free)-cm(r2);cands.push(r2.map(r=>nrm(r+off)))}}
  let best=null;for(const slots of cands){const used=new Set();const[c1]=greedy(fixed,slots,used);const[c2,pf]=greedy(free,slots,used);const c=c1+(fixed.length?0.001:1)*c2;if(!best||c<best.c-1e-6)best={c,pf,slots,used}}return best}
function suggest(a){const I=info(a);if(!I.n)return[];const f=I.f-1,k=f>0?Math.floor(f/2)+f%2:0;const b=fit(I.ns.map(n=>ang(a,n.o)),[],I.n+1,k);return b.slots.filter((s,i)=>!b.used.has(i))}
function gapDir(d){if(!d.length)return 0;const s=[...d].sort((x,y)=>x-y);let bg=-1,bm=0;s.forEach((v,i)=>{const g=(i+1<s.length?s[i+1]:s[0]+360)-v;if(g>bg){bg=g;bm=v+g/2}});return nrm(bm)}
function freeDir(a){const s=suggest(a);return s.length?s[0]:gapDir(nb(a).map(n=>ang(a,n.o)))}
function lpDirs(a,I){const k=I.k;if(!k)return[];const d=I.ns.map(n=>ang(a,n.o)).sort((x,y)=>x-y);if(!d.length)return[270,0,90,180].slice(0,k);
  const gaps=d.map((v,i)=>({s:v,g:(i+1<d.length?d[i+1]:d[0]+360)-v,c:0}));
  for(let i=0;i<k;i++){let bi=0,bv=-1;gaps.forEach((g,j)=>{const v=g.g/(g.c+1);if(v>bv+1e-6){bv=v;bi=j}});gaps[bi].c++}
  const out=[];gaps.forEach(g=>{for(let j=1;j<=g.c;j++)out.push(nrm(g.s+g.g*j/(g.c+1)))});return out}
function check(a,I){if(I.f<0)return'zu viele Bindungen';if(MET.has(a.el))return null;const e=2*I.bs+I.f;
  if(a.el==='H')return e===2?null:'kein Duplett';if(e===8)return null;if(e>8)return EXP.has(a.el)?null:'mehr als 8 Elektronen';return'nur '+e+' Valenzelektronen (Oktett unvollständig)'}
function vlab(a,I){const n=I.n,k=I.k,allH=I.ns.every(x=>x.o.el==='H');if(n<2||n+k>4)return null;
  if(n===2&&k===0)return'180°';if(n===3&&k===0)return'120°';if(n===2&&k===1)return'< 120°';if(n===4)return'109,5°*';
  if(n===3)return a.el==='N'&&a.q===0&&allH?'107°':'< 109,5°';return a.el==='O'&&a.q===0&&allH?'104,5°':'< 109,5°'}

/* Halbstrukturformel: H-Atome an Nicht-H-Atomen werden in die Gruppe gezogen (CH₃, OH …), keine freien Elektronenpaare */
const half=()=>O.mode==='half'||O.mode==='skel',skel=()=>O.mode==='skel',isVert=a=>skel()&&a.el==='C'&&nb(a).some(n=>n.o.el!=='H'),isHid=a=>half()&&a.el==='H'&&nb(a).some(n=>n.o.el!=='H');
const cw=ch=>/[0-9]/.test(ch)?8:/[a-z]/.test(ch)?11:15.5;
function grp(a){const hc=half()?nb(a).filter(n=>isHid(n.o)).length:0;if(!hc)return{t:[[a.el,0]],w:[...a.el].reduce((s,c)=>s+cw(c),0)};
  const hv=nb(a).filter(n=>!isHid(n.o)),hf=hv.length?hv.every(n=>Math.cos(rad(ang(a,n.o)))>0.35):['O','S','F','Cl','Br','I'].includes(a.el);
  const hp=[['H',0]];if(hc>1)hp.push([String(hc),1]);const t=hf?[...hp,[a.el,0]]:[[a.el,0],...hp];return{t,w:t.reduce((s,[x,u])=>s+[...x].reduce((q,c)=>q+(u?8:cw(c)),0),0)}}
function grpSvg(a,col){const g=grp(a);let inner='',sh=0;for(const[x,u]of g.t){const dy=u?6-sh:-sh;sh+=dy;inner+=`<tspan${dy?` dy="${dy}"`:''}${u?' font-size="15"':''}>${x}</tspan>`}
  return`<text x="${F(a.x)}" y="${F(a.y)}" text-anchor="middle" dominant-baseline="central" font-family="${FONT}" font-size="22" fill="${col}">${inner}</text>`}
function trim(a,ux,uy){if(isVert(a))return 0;if(!half())return a.el.length>1?17:13;const hw=grp(a).w/2+3,hh=13;return Math.min(Math.abs(ux)>1e-3?hw/Math.abs(ux):1e9,Math.abs(uy)>1e-3?hh/Math.abs(uy):1e9)+2}
function body(ex){let h='';const probs=[];let tet=false;const hm=half(),ring=O.ang&&!hm?ringSet():new Set();
  for(const b of S.bonds){const p=A(b.a),q=A(b.b);const dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1;const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;if(isHid(p)||isHid(q))continue;const s1=trim(p,ux,uy),s2=trim(q,-ux,-uy);if(len<s1+s2+2)continue;
    for(const o of b.o===1?[0]:b.o===2?[-3.6,3.6]:[-6,0,6])h+=`<line x1="${F(p.x+ux*s1+nx*o)}" y1="${F(p.y+uy*s1+ny*o)}" x2="${F(q.x-ux*s2+nx*o)}" y2="${F(q.y-uy*s2+ny*o)}" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`}
  for(const a of S.atoms){if(isHid(a))continue;const I=info(a),col=O.col?EL[a.el][1]:INK,big=a.el.length>1,lp=hm?[]:lpDirs(a,I),bd=I.ns.filter(n=>!isHid(n.o)).map(n=>ang(a,n.o)),gw=hm?grp(a).w/2:0;
    if(O.ang&&!hm&&!ring.has(a.id)){const t=vlab(a,I);if(t){const s=I.ns.map(n=>({d:ang(a,n.o),t:nb(n.o).length===1})).sort((x,y)=>x.d-y.d);let bg=null;
      s.forEach((v,i)=>{const w=s[(i+1)%s.length],g=(i+1<s.length?w.d:w.d+360)-v.d,sc=(v.t&&w.t?0:1000)+g;if(lp.some(l=>{const r=nrm(l-v.d);return r>0.5&&r<g-0.5}))return;if(!bg||sc<bg.sc-0.01)bg={v:v.d,g,sc}});
      if(bg){const r0=big?30:26,r1=big?48:44,p1=pol(a,bg.v,r0),p2=pol(a,bg.v+bg.g,r0),m=pol(a,bg.v+bg.g/2,r1);
        h+=`<path d="M${F(p1.x)} ${F(p1.y)}A${r0} ${r0} 0 ${bg.g>180?1:0} 1 ${F(p2.x)} ${F(p2.y)}" fill="none" stroke="${ACC}" stroke-width="1.5"/><text x="${F(m.x)}" y="${F(m.y)}" text-anchor="middle" dominant-baseline="central" font-family="${FONT}" font-size="12" fill="#c25e00">${t}</text>`;if(t.includes('*'))tet=true}}}
    const pb=check(a,I);if(pb){probs.push(a.el+': '+pb);if(!ex&&O.chk)h+=`<circle cx="${F(a.x)}" cy="${F(a.y)}" r="${Math.max(big?22:19,gw+5)}" fill="#d22d1f" fill-opacity=".08" stroke="#d22d1f" stroke-width="1.6" stroke-dasharray="4 3"/>`}
    if(!isVert(a))h+=grpSvg(a,col);
    const r=big?23:18;lp.forEach((d,i)=>{const c=pol(a,d,r),nx=-Math.sin(rad(d)),ny=Math.cos(rad(d));
      if(i>=I.p)h+=`<circle cx="${F(c.x)}" cy="${F(c.y)}" r="2.3" fill="${col}"/>`;
      else if(O.lp==='bar')h+=`<line x1="${F(c.x-nx*6.5)}" y1="${F(c.y-ny*6.5)}" x2="${F(c.x+nx*6.5)}" y2="${F(c.y+ny*6.5)}" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
      else h+=`<circle cx="${F(c.x-nx*4)}" cy="${F(c.y-ny*4)}" r="2.1" fill="${col}"/><circle cx="${F(c.x+nx*4)}" cy="${F(c.y+ny*4)}" r="2.1" fill="${col}"/>`});
    if(a.q){const occ=bd.concat(lp);let bc=315,bv=-1;[315,225,45,135,0,180,270,90].forEach(c=>{const m=occ.length?Math.min(...occ.map(o=>adiff(o,c))):360;if(m>bv+0.5){bv=m;bc=c}});
      const c=pol(a,bc,Math.max(big?31:28,gw+12)),t=(Math.abs(a.q)>1?Math.abs(a.q):'')+(a.q>0?'+':'−'),cr=Math.abs(a.q)>1?9:7.5;
      h+=`<circle cx="${F(c.x)}" cy="${F(c.y)}" r="${cr}" fill="#fff" stroke="${col}" stroke-width="1.3"/><text x="${F(c.x)}" y="${F(c.y+0.5)}" text-anchor="middle" dominant-baseline="central" font-family="${FONT}" font-size="${Math.abs(a.q)>1?10:13}" font-weight="700" fill="${col}">${t}</text>`}}
  h+=nameLabels(ex);return{h,probs,tet}}

const GRID='<defs><pattern id="gp" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#e4ddd3"/></pattern></defs><rect width="100%" height="100%" fill="url(#gp)"/>';

function placeHAll(){S.atoms.filter(a=>a.el!=='H').forEach(placeH)}
function skelApply(){const ring=ringSet();
  for(const comp of comps()){const hv=comp.filter(a=>a.el!=='H');if(comp.some(a=>ring.has(a.id))){hv.forEach(placeH);continue}if(hv.length<2)continue;
    const ids=new Set(hv.map(a=>a.id)),hn=a=>nb(a).filter(n=>ids.has(n.o.id)).map(n=>n.o);
    const far=st=>{const par=new Map([[st.id,null]]),q=[st];let last=st;while(q.length){const x=q.shift();last=x;for(const y of hn(x))if(!par.has(y.id)){par.set(y.id,x);q.push(y)}}return{last,par}};
    const a0=far(hv[0]).last,r=far(a0),chain=[];let x=r.last;while(x){chain.push(x);x=r.par.get(x.id)}if(chain[0].x>chain[chain.length-1].x)chain.reverse();

    const size=(k,p)=>{const sd=side(k.id,p.id);return sd?sd.size:0},lin=a=>nb(a).some(n=>n.b.o===3)||nb(a).filter(n=>n.b.o===2).length>=2;

    while(st.length){const{a,din,t}=st.pop(),P=pos.get(a.id);let kids=hn(a).filter(o=>!pos.has(o.id));if(!kids.length)continue;
      const pref=kids.find(k=>k.id===nextOn.get(a.id))||[...kids].sort((u,v)=>size(v,a)-size(u,a))[0];kids=[pref,...kids.filter(k=>k!==pref)];
      let d0,t0;if(din===null){d0=-30;t0=-1}else if(lin(a)){d0=din;t0=t}else{const sg=-t;d0=nrm(din+60*sg);t0=sg}
      const occ=[d0];if(din!==null)occ.push(nrm(din+180));const rest=spread(occ,kids.length-1),dirs=[d0,...rest];
      kids.forEach((k,i)=>{const d=dirs[i],p=pol(P,d,L);pos.set(k.id,{x:p.x,y:p.y});const tr=i===0?t0:(nrm(d-(din??d0))>180?-1:1);st.push({a:k,din:d,t:tr})})}
    const ps=[...pos.values()],mx=ps.reduce((t,p)=>t+p.x,0)/ps.length,my=ps.reduce((t,p)=>t+p.y,0)/ps.length;
    hv.forEach(a=>{const p=pos.get(a.id);if(p){a.x=cx+p.x-mx;a.y=cy+p.y-my}});hv.forEach(placeH)}}
function want(a){if(a.el==='H'||MET.has(a.el))return 0;if(a.el==='C')return 4-Math.abs(a.q);if(a.el==='B')return 3-a.q;return 8-EL[a.el][0]+a.q}
function addH(){snap();let any=false;for(const a of[...S.atoms]){let m=want(a)-info(a).bs;for(;m>0;m--){attach(a,'H');any=true}}if(!any){U.pop();flash('Alle Atome sind bereits abgesättigt.');return}commit()}
function benz(){snap();const r=sv.getBoundingClientRect();let cx=(r.width/2-V.x)/V.s,cy=(r.height/2-V.y)/V.s;for(let i=0;i<12&&S.atoms.some(a=>Math.hypot(a.x-cx,a.y-cy)<L*2);i++)cx+=L*1.2;

  for(let i=0;i<6;i++)S.bonds.push({a:at[i].id,b:at[(i+1)%6].id,o:i%2?1:2});commit()}

function side(m,pv){const seen=new Set([m]),q=[m];while(q.length){const x=q.shift();for(const n of nb(A(x))){const y=n.o.id;if(x===m&&y===pv)continue;if(y===pv)return null;if(!seen.has(y)){seen.add(y);q.push(y)}}}return seen}
function rotSetup(d){let pv=null,set=null;
  if(d.b){const a=A(d.b.a),c=A(d.b.b),sa=side(a.id,c.id),sc=side(c.id,a.id);if(!sa||!sc)return null;if(sa.size<=sc.size){pv=c;set=sa}else{pv=a;set=sc}}
  else if(d.a){for(const n of nb(d.a)){const s=side(d.a.id,n.o.id);if(s&&(!set||s.size<set.size)){set=s;pv=n.o}}if(!set)return null}else return null;
  return{pv,set,a0:ang(pv,{x:d.x0,y:d.y0}),orig:new Map([...set].map(id=>{const a=A(id);return[id,{x:a.x,y:a.y}]}))}}
function sp(e){const r=sv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pt(e){const q=sp(e);return{x:(q.x-V.x)/V.s,y:(q.y-V.y)/V.s}}
function fitView(){const vis=S.atoms.filter(a=>!isHid(a)),r=sv.getBoundingClientRect();if(!vis.length||!r.width){V={s:1,x:0,y:0};render();return}
  const xs=vis.map(a=>a.x),ys=vis.map(a=>a.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys)+(O.nm?50:0),pad=50;
  const s=clampS(Math.min(r.width/(x1-x0+2*pad),(r.height-24)/(y1-y0+2*pad),1.6));V={s,x:r.width/2-(x0+x1)/2*s,y:(r.height-24)/2-(y0+y1)/2*s};render()}
function hitA(x,y,ex){let best=null,bd=Math.max(24,24/V.s);for(const a of S.atoms){if(a===ex||isHid(a))continue;const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;best=a}}return best}
function hitB(x,y){let best=null,bd=Math.max(11,14/V.s);for(const b of S.bonds){const p=A(b.a),q=A(b.b),dx=q.x-p.x,dy=q.y-p.y,l2=dx*dx+dy*dy||1;const t=Math.max(0,Math.min(1,((x-p.x)*dx+(y-p.y)*dy)/l2));const d=Math.hypot(p.x+t*dx-x,p.y+t*dy-y);if(d<bd){bd=d;best=b}}return best}

  let d=ang(src,p),bs=null,bd=40;(drag.a?suggest(drag.a):[]).forEach(v=>{const x=adiff(v,d);if(x<bd){bd=x;bs=v}});d=bs!==null?bs:Math.round(d/15)*15;const e=pol(src,d,L);return{x1:src.x,y1:src.y,x2:e.x,y2:e.y,t:null}}
sv.addEventListener('pointerdown',e=>{try{sv.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,sp(e));
  if(pts.size===2){if(drag){if(drag.sn||(drag.rot&&!drag.rot.none))commit();drag=null;prev=null;render()}const[a,b]=[...pts.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},V0:{...V}};return}
