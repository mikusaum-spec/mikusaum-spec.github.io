<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewis-Zeichner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhiges, sachliches Werkzeug für den Chemieunterricht
   IDEA: ein weißes Zeichenblatt aus dem Arbeitsheft
   PICTURE: das Blatt selbst mit dem Molekül, füllt den Bildschirm
   COLOUR and TYPE: Chemie-Orange als Akzent, Tinte auf Weiß; Source Sans 3
   LAYOUT: Werkzeuge oben, Blatt in der Mitte, Formel und Prüfung unten */
:root{color-scheme:light dark;--bg:light-dark(#f3efe9,#1b1a19);--ink:light-dark(#1d1b19,#ece8e3);--mut:light-dark(#6b645c,#a59d94);--line:light-dark(#d9d2c8,#3d3935);--btn:light-dark(#fff,#272523);--acc:#e2730b;--err:#d22d1f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow-x:clip;overflow-y:auto}
header{display:flex;align-items:baseline;gap:12px;padding:10px max(2vw,12px) 2px;flex-wrap:wrap}
h1{font-size:24px;margin:0;line-height:1.1}
header .sub{color:var(--mut);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:5px max(2vw,12px);align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border:0}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg button:last-child{border-radius:0 10px 10px 0}
.lab{font-size:13px;color:var(--mut);margin-right:2px}
button{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:10px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.35;cursor:default}
.pal button{font-weight:700;font-size:17px;padding:0 6px}
.pal button.m{font-weight:600}
.pal button.on{color:#fff}
.board{flex:1 1 320px;position:relative;margin:4px max(2vw,12px);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 28px rgb(0 0 0 / .09)}
#sv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:12px;bottom:9px;right:12px;font-size:13px;color:#7a7168;pointer-events:none}
footer{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:4px max(2vw,12px) 10px;font-size:15px}
#fo{font-size:19px;font-weight:600}
#pr{color:#2f7d32}#pr.bad{color:var(--err)}
#tn{color:var(--mut);font-size:13px}
.opt{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.opt button{min-height:40px;font-size:14px}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.show{display:flex}
.card{background:var(--btn);color:var(--ink);border-radius:14px;padding:18px;max-width:600px;width:100%;max-height:92vh;overflow:auto}
.card img{max-width:100%;max-height:52vh;display:block;margin:12px auto;background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card p{margin:6px 0 12px;font-size:14px;color:var(--mut)}
.mobOnly{display:none}
.v3{position:absolute;inset:0;background:#fff;display:none;z-index:3}.v3.show{display:block}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.v3bar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.v3bar button{min-height:40px;font-size:14px;padding:0 10px}
.v3i{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;color:#5b534a;text-align:center;pointer-events:none}
body.mob .v3bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}body.mob .v3bar>*,body.mob .v3bar button{flex:none}

.task.show{display:flex}.task .tt{flex:1 1 260px}.task button{min-height:40px;font-size:14px}.task .fb{flex-basis:100%;font-size:14px}.task .fb.ok{color:#2f7d32;font-weight:600}.task .fb.no{color:var(--err)}

#shBody .grp,#shBody .opt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;border:0}#shBody button{min-height:44px}
body.mob .mobOnly{display:flex}body.mob .pal .lab{display:none}body.mob header{display:none}
body.mob .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 8px;gap:4px}body.mob .bar::-webkit-scrollbar{display:none}

body.mob footer{display:grid;gap:0;padding:3px 10px calc(6px + env(safe-area-inset-bottom))}
body.mob #fo{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.mob #pr{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.mob #tn{display:none}
</style>

<body>
<header><h1>Lewis-Zeichner</h1><span class="sub">Valenzstrichformeln mit freien Elektronenpaaren und VSEPR-Winkeln</span></header>
<div class="bar" id="bar1">
  <div class="grp mobOnly"><button id="bMore">☰ Mehr</button></div>
  <div class="grp"><button id="bU" aria-label="Rückgängig" title="Rückgängig">↶</button><button id="bR" aria-label="Wiederholen" title="Wiederholen">↷</button><button id="bF" title="Alles ins Bild holen">Einpassen</button></div>
  <div class="grp" id="tools">
    <button data-t="draw" class="on">Zeichnen</button>

    <button id="bN">IUPAC-Name</button>
    <button id="bP" class="on">PNG / SVG</button>
    <button id="b3">3D-Ansicht</button>
    <button id="bNm">Name → Molekül</button>
    <button id="bTk">Aufgabe</button>
    <button id="bS">Speichern</button>
    <button id="bO">Öffnen</button><input type="file" id="fi" accept=".json,application/json" hidden>
  </div>
</div>
<div class="bar pal" id="pal"></div>
<div class="task" id="task"></div>
<main class="board"><svg id="sv" aria-label="Zeichenfläche"></svg><div class="ctx" id="ctx"></div><div class="v3" id="v3"><canvas id="c3" aria-label="3D-Modell"></canvas>
  <div class="v3bar"><span class="seg" id="v3s"><button data-s="ball" class="on">Kugel-Stab</button><button data-s="space">Kalotte</button><button data-s="stick">Stäbe</button></span><button id="v3l" class="on">Elektronenpaare</button><button id="v3r">Drehen ▶</button><button id="v3p">Bild speichern</button><button id="v3x" class="on">Schließen</button></div>
  <div class="v3i" id="v3i"></div></div><div class="hint" id="hint"></div></main>
<footer id="foot">
  <span id="fo"></span><span id="pr"></span><span id="tn"></span>
  <span class="opt" id="opts">
    <button id="oL">Paare: Striche</button>
    <button id="oW">Winkel</button>

    <button id="oS">C* Stereozentren</button>
  </span>
</footer>
<div class="sheet" id="sh"><div class="sheetIn"><div class="row" style="justify-content:space-between"><b>Weitere Funktionen</b><button id="shx">Schließen</button></div><div id="shBody"></div></div></div>
<div class="modal" id="ed"><div class="card">
  <b id="edT">Text</b>
  <div id="edText"><input id="et" class="inp" placeholder="Text, z. B. + oder Katalysator" autocomplete="off">
    <div class="row" id="eq"><button data-q="+">+</button><button data-q="δ+">δ+</button><button data-q="δ−">δ−</button><button data-q="Δ">Δ</button><button data-q="hν">hν</button><button data-q="⊕">⊕</button><button data-q="⊖">⊖</button></div></div>
  <div id="edArr"><div class="row" id="ek"><button data-k="to">→ Reaktion</button><button data-k="eq">⇌ Gleichgewicht</button><button data-k="res">↔ Mesomerie</button></div>
    <label class="lbl">über dem Pfeil<input id="eu" class="inp" autocomplete="off"></label><label class="lbl">unter dem Pfeil<input id="eb" class="inp" autocomplete="off"></label></div>
  <div class="row" style="margin-top:14px"><button id="eok" class="on">Übernehmen</button><button id="edel">Löschen</button><button id="ecn">Abbrechen</button></div>
</div></div>
<div class="modal" id="nmD"><div class="card">
  <div class="row" style="justify-content:space-between"><b>Molekül aus dem Namen zeichnen</b><button id="nmX">Schließen</button></div>
  <input id="nmI" class="inp" placeholder="z. B. 2-Methylbutan" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row" id="nmEx"></div><p id="nmE" class="msg"></p>
  <div class="row"><button id="nmGo" class="on">Zeichnen</button></div>
</div></div>
<div class="modal" id="tkD"><div class="card">
  <div class="row" style="justify-content:space-between"><b>Aufgabe stellen</b><button id="tkX">Schließen</button></div>
  <div class="row seg" id="tkT" style="margin-top:10px"><button data-k="name" class="on">Molekül zum Namen</button><button data-k="formula">Summenformel</button><button data-k="iso">Isomere finden</button></div>
  <input id="tkI" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="chk" id="tkSL"><input type="checkbox" id="tkS"> Schülerinnen und Schüler dürfen die Lösung anzeigen</label>
  <p id="tkE" class="msg"></p>
  <div class="row"><button id="tkGo" class="on">Hier starten</button><button id="tkL">Link für die Klasse erzeugen</button></div>
  <div id="tkLB" style="display:none"><input id="tkLink" class="inp" readonly><div class="row"><button id="tkCp">Link kopieren</button></div></div>
</div></div>
<div class="modal" id="md"><div class="card">
  <div class="row" style="justify-content:space-between"><b>PNG-Export</b><button id="mx">Schließen</button></div>
  <img id="mi" alt="Exportiertes Molekül">
  <p id="mm"></p>
  <div class="row"><button id="md2" class="on">Herunterladen</button><button id="mc">In Zwischenablage kopieren</button><button id="mt">Hintergrund: weiß</button><button id="msv">Als SVG speichern</button></div>
</div></div>
<script>
{
const EL={H:[1,'#5a5a5a',1.008],B:[3,'#b5651d',10.81],C:[4,'#111111',12.011],N:[5,'#1f4fd1',14.007],O:[6,'#d8261c',15.999],F:[7,'#1c8a3c',18.998],Na:[1,'#6b4fbb',22.990],Mg:[2,'#2e7d5b',24.305],Al:[3,'#7a7f86',26.982],P:[5,'#d9730d',30.974],S:[6,'#a88400',32.06],Cl:[7,'#1c8a3c',35.45],K:[1,'#6b4fbb',39.098],Ca:[2,'#2e7d5b',40.078],Br:[7,'#8a2a12',79.904],I:[7,'#6b2c91',126.904]};
const MET=new Set(['Na','K','Mg','Ca','Al']),EXP=new Set(['P','S','Cl','Br','I']);
const PAL=['H','C','N','O','S','P','F','Cl','Br','I','B','Na','K','Mg','Ca','Al'];
const L=60,FONT='Arial,Helvetica,sans-serif',INK='#1d1b19',ACC='#e2730b',KEY='lewis-zeichner-1';
const HINTS={draw:'Leere Fläche antippen: Atom setzen · Von einem Atom ziehen: Bindung · Atom antippen: durch gewähltes Element ersetzen (gleiches Element: Nachbaratom anhängen) · Bindung antippen: einfach → doppelt → dreifach',swap:'Atom antippen: wird zum gewählten Element · Bindung antippen: Bindungsordnung ändern',move:'Atom, Pfeil oder Text ziehen: verschieben · Leere Fläche ziehen: Ansicht verschieben · Zwei Finger: zoomen',hand:'Bindung oder Endatom ziehen: dreht diesen Molekülteil um das Nachbaratom (15°-Schritte), Bindungslänge bleibt gleich',qp:'Atom antippen: Ladung um +1 erhöhen',qm:'Atom antippen: Ladung um −1 verringern',del:'Atom, Bindung, Pfeil oder Text antippen: löschen',sel:'Molekül, Pfeil oder Text antippen: auswählen/abwählen · Rahmen aufziehen: mehrere auswählen · Ausgewähltes ziehen: verschieben',arrow:'Ziehen: Reaktionspfeil zeichnen (Art oben wählen) · Pfeil antippen: Art und Beschriftung ändern',text:'Leere Stelle antippen: Text oder „+“ einfügen · Text antippen: bearbeiten',curve:'Von freiem Elektronenpaar, Bindung oder Atom zum Zielatom/zur Zielbindung ziehen · Pfeil antippen: Bogen auf die andere Seite · Art oben wählen',stereo:'Bindung antippen: normal → Keil (nach vorn) → Strich-Keil (nach hinten). Die Spitze liegt am Atom, das näher an deinem Finger ist',hb:'Vom H-Atom (an N, O oder F) zum Akzeptor-Atom (N, O oder F) eines anderen Moleküls ziehen'};
let S={atoms:[],bonds:[],items:[],n:1},O={lp:'bar',ang:true,chk:true,col:false,tr:false,nm:false,mode:'lewis',dp:false,tw:false,sc:false};
let V={s:1,x:0,y:0},pinch=null;const pts=new Map(),clampS=v=>Math.max(.25,Math.min(4,v));
let SEL={a:new Set(),i:new Set()},RB=null,AK='to',CK='pair',CUP=null,HBP=null,ARP=null,EDIT=null;
let tool='draw',sel='C',U=[],R=[],drag=null,prev=null,exNote=false,blobUrl=null,lastBlob=null,ht=null;
const $=id=>document.getElementById(id),sv=$('sv');
const rad=d=>d*Math.PI/180,nrm=d=>((d%360)+360)%360,F=n=>Math.round(n*10)/10;
const adiff=(a,b)=>{const d=Math.abs(nrm(a)-nrm(b));return d>180?360-d:d};
const A=id=>S.atoms.find(a=>a.id===id);
const nb=a=>S.bonds.filter(b=>b.a===a.id||b.b===a.id).map(b=>({b,o:A(b.a===a.id?b.b:b.a)}));
const ang=(p,q)=>nrm(Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI);
const pol=(a,d,r)=>({x:a.x+r*Math.cos(rad(d)),y:a.y+r*Math.sin(rad(d))});

function info(a){const ns=nb(a);const bs=ns.reduce((s,n)=>s+n.b.o,0);const f=EL[a.el][0]-a.q-bs;let p=f>0?Math.floor(f/2):0,r=f>0?f%2:0;if(!ns.length&&f>0){p=Math.max(0,f-4);r=f-2*p}return{ns,bs,f,p,r,k:p+r,n:ns.length}}

/* VSEPR: relative Richtungen der Bindungen je nach Zahl der Bindungspartner (n) und freien Elektronenpaare (k) */
function idealRel(n,k){if(n<=1)return[0];if(n+k<=4){if(n===2)return k===0?[0,180]:k===1?[0,120]:[0,104.5];if(n===3)return k===0?[0,120,240]:[0,107,214];if(n===4)return[0,90,180,270]}return[...Array(n)].map((_,i)=>i*360/n)}
function greedy(items,slots,used){let c=0;const pick=[];for(const it of items){let bi=-1,bd=1e9;slots.forEach((s,i)=>{if(!used.has(i)){const d=adiff(it,s);if(d<bd){bd=d;bi=i}}});if(bi<0){pick.push(null);continue}used.add(bi);c+=bd*bd;pick.push(slots[bi])}return[c,pick]}
function fit(fixed,free,n,k){const rel=idealRel(n,k),cands=[],anchors=fixed.length?fixed:free.length?free:[0];
  for(const an of anchors)for(let j=0;j<rel.length;j++)for(const m of[1,-1])cands.push(rel.map(r=>nrm(an+m*(r-rel[j]))));
  if(!fixed.length&&free.length>1){const cm=a=>Math.atan2(a.reduce((s,v)=>s+Math.sin(rad(v)),0),a.reduce((s,v)=>s+Math.cos(rad(v)),0))*180/Math.PI;for(const m of[1,-1]){const r2=rel.map(r=>m*r),off=cm(free)-cm(r2);cands.push(r2.map(r=>nrm(r+off)))}}
  let best=null;for(const slots of cands){const used=new Set();const[c1]=greedy(fixed,slots,used);const[c2,pf]=greedy(free,slots,used);const c=c1+(fixed.length?0.001:1)*c2;if(!best||c<best.c-1e-6)best={c,pf,slots,used}}return best}
function suggest(a){const I=info(a);if(!I.n)return[];const f=I.f-1,k=f>0?Math.floor(f/2)+f%2:0;const b=fit(I.ns.map(n=>ang(a,n.o)),[],I.n+1,k);return b.slots.filter((s,i)=>!b.used.has(i))}
function gapDir(d){if(!d.length)return 0;const s=[...d].sort((x,y)=>x-y);let bg=-1,bm=0;s.forEach((v,i)=>{const g=(i+1<s.length?s[i+1]:s[0]+360)-v;if(g>bg){bg=g;bm=v+g/2}});return nrm(bm)}
function freeDir(a){const s=suggest(a);return s.length?s[0]:gapDir(nb(a).map(n=>ang(a,n.o)))}
function lpDirs(a,I){const k=I.k;if(!k)return[];const d=I.ns.map(n=>ang(a,n.o)).sort((x,y)=>x-y);if(!d.length)return[270,0,90,180].slice(0,k);
  const gaps=d.map((v,i)=>({s:v,g:(i+1<d.length?d[i+1]:d[0]+360)-v,c:0}));
  for(let i=0;i<k;i++){let bi=0,bv=-1;gaps.forEach((g,j)=>{const v=g.g/(g.c+1);if(v>bv+1e-6){bv=v;bi=j}});gaps[bi].c++}
  const out=[];gaps.forEach(g=>{for(let j=1;j<=g.c;j++)out.push(nrm(g.s+g.g*j/(g.c+1)))});return out}
function check(a,I){if(I.f<0)return'zu viele Bindungen';if(MET.has(a.el))return null;const e=2*I.bs+I.f;
