<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Säure-Base-Training Q1 LK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Laborheft — schmale Ich-kann-Spalte links, Aufgabenkarte rechts; Universalindikator-Skala als einziges Farbelement */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#18262A; --muted:#56676B; --line:#D3DCDB;
  --accent:#1D6670; --accent-soft:#DCEBEC;
  --oxy:#C9473B; --probe:#F3C9DE; --ok:#2B7A4B; --ok-soft:#E1F1E6; --bad:#B23A2E; --bad-soft:#F7E3E0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --ind:linear-gradient(90deg,#D3242B 0%,#EC6A23 18%,#F0B42A 34%,#E4DA3A 44%,#5DAE46 50%,#2E9387 62%,#2C6BB0 76%,#3C3F9A 88%,#5E2F86 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A1C; --surface:#182427; --ink:#E3ECEA; --muted:#9AAEB0; --line:#2C3C40;
  --accent:#6CC0C8; --accent-soft:#1D3639; --oxy:#E2786C; --probe:#6B3A55; --ok:#6CC995; --ok-soft:#173226; --bad:#F08A7E; --bad-soft:#3A201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A1C; --surface:#182427; --ink:#E3ECEA; --muted:#9AAEB0; --line:#2C3C40;
  --accent:#6CC0C8; --accent-soft:#1D3639; --oxy:#E2786C; --probe:#6B3A55; --ok:#6CC995; --ok-soft:#173226; --bad:#F08A7E; --bad-soft:#3A201D; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Kopf */
header{display:grid;gap:14px;margin-bottom:28px}
header h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.01em}
.scale{max-width:560px}
.scale .bar{height:12px;border-radius:6px;background:var(--ind)}
.scale .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:700;justify-self:start}

/* Startseite */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.cat h2{font-size:1.2rem;font-weight:600}
.cat p{margin:0;color:var(--muted)}
.cat .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:4px}
.cat.ready{border-color:var(--accent)}
.cat.ready:hover{background:var(--accent-soft)}
.cat:disabled{cursor:default;opacity:.62}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.home-note{margin-top:22px;color:var(--muted);max-width:65ch}

/* Kategorie */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-areas:"aside main";gap:24px;align-items:start}
.layout main{grid-area:main;display:grid;gap:18px;min-width:0}
.layout aside{grid-area:aside;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.layout{grid-template-columns:1fr;grid-template-areas:"main" "aside"}.layout aside{position:static}}

.info{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.info summary{padding:14px 18px;font-family:var(--f-display);font-weight:600;font-size:1.1rem;cursor:pointer}
.info .body{padding:0 18px 18px;display:grid;gap:12px;max-width:72ch}
.info p{margin:0}
.formula{font-family:var(--f-mono);background:var(--accent-soft);border-radius:6px;padding:8px 12px;overflow-x:auto;white-space:nowrap}
.rules{margin:0;padding-left:1.2em;display:grid;gap:4px}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:grid;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.tab .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tab .t{font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab[aria-selected="true"] .n{color:var(--surface);opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:1.25rem;font-weight:600}
.streak{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

.opts{display:grid;gap:8px}

.opt .key{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);background:var(--surface)}
.opt .val{min-width:0;font-variant-numeric:tabular-nums}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.fb{border-radius:8px;padding:14px 16px;display:grid;gap:8px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.fb strong.v{font-family:var(--f-display);font-size:1.05rem}
.fb p{margin:0}
.sol{font-family:var(--f-mono);font-size:.92rem;line-height:1.7;overflow-x:auto}
.mini{position:relative;height:10px;border-radius:5px;background:var(--ind);margin:14px 0 4px;max-width:420px}
.mini .mk{position:absolute;top:-6px;width:3px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}

.qbar{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--surface)}
.hint{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:.95rem}
.hint .formula{background:var(--surface);margin-top:6px}

/* Ich-kann-Spalte */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.panel h3{font-size:1.05rem;font-weight:600}
.item{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item .txt{font-size:.92rem}
.item .txt b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-right:4px}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}

.where{font-size:.85rem;color:var(--muted);margin:0}
.big{display:inline-block;margin-top:8px;font-size:1.6rem;font-family:var(--f-mono)}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.grid2 .opt{align-items:flex-start}
.beaker{width:100%;max-width:220px;height:auto;display:block}
.pc-box{fill:var(--surface);stroke:var(--line)}
.pc-a{fill:var(--muted)}
.pc-h{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.pc-o{fill:var(--oxy)}
.pc-q{fill:var(--ink);font:700 10px var(--f-mono);text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.9rem;margin-bottom:10px}
.legend>span{display:inline-flex;align-items:center;gap:4px}
.legend .lnote{color:var(--muted);font-size:.82rem}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}

.figwrap{display:block;margin-bottom:10px}

.tf-metal{fill:var(--muted)}

.tf-knob{fill:var(--ink)}
.tf-bar{fill:var(--ink)}
.tf-lead{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
.tf-num{fill:var(--accent)}
.tf-numt{fill:var(--surface);font:700 11px var(--f-mono);text-anchor:middle}
.tablewrap{overflow-x:auto}
table.ind{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.ind th,table.ind td{text-align:left;padding:5px 12px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.ind th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chartwrap{display:block;margin-bottom:10px;max-width:520px}
.chart{width:100%;height:auto;display:block}
.chcap{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.ch-grid{stroke:var(--line);stroke-width:.8}
.ch-grid2{stroke:var(--line);stroke-width:.5;stroke-dasharray:2 3}
.ch-axis{stroke:var(--muted);stroke-width:1}
.ch-tick{fill:var(--muted);font:10px var(--f-mono)}

.ch-lab{fill:var(--accent);font:700 11px var(--f-body)}
.ch-lab.alt{fill:var(--oxy)}
.ch-mk{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.ch-mkt{fill:var(--ink);font:700 12px var(--f-mono)}
.tf-cable{fill:none;stroke:var(--ink);stroke-width:1.4}
.tf-elec{fill:var(--line);stroke:var(--ink);stroke-width:1.2}
.tf-meter{fill:var(--line);stroke:var(--ink);stroke-width:1.2}

<div class="wrap">
  <header>
    <button class="back" id="back" hidden>← Alle Kategorien</button>
    <span class="eyebrow">Chemie Q1 LK · Vorbereitung 1. Klausur</span>
    <h1 id="h1">Säuren und Basen</h1>
    <div class="scale" aria-hidden="true">
      <div class="bar"></div>
      <div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>7</span><span>8</span><span>10</span><span>12</span><span>14</span></div>
    </div>

<script>
/* ---------- Speicher ---------- */
const STORE = 'sb-q1-lk-v1';
let state = { stats:{}, self:{} };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.stats) state = s; } catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} }

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const lg = Math.log10;
const num = (x,d=2) => x.toFixed(d).replace('.',',').replace('-','−');
const dec = x => String(x).replace('.',',');
function pot(x){ // a,b · 10^n
  let n = Math.floor(lg(x)); let m = x/Math.pow(10,n);
  m = Math.round(m*10)/10; if (m>=10){ m/=10; n++; }
  if (n===0) return num(m,1);
  if (n===1) return num(m*10,0);
  return `${num(m,1)} · 10<sup>${String(n).replace('-','−')}</sup>`;
}
const conc = x => pot(x)+' mol/L';
function pick(correct, distractors){
  const seen = new Set([correct.html]); const out = [];
  for (const d of shuffle(distractors.slice())){
    if (seen.has(d.html)) continue; seen.add(d.html); out.push(d); if (out.length===3) break;
  }
  return shuffle([{...correct, correct:true}, ...out]);
}
const fromPool = pool => { const q = rnd(pool); return { stem:q.q, options:pick({html:q.c}, q.d), sol:q.sol }; };

/* ---------- Daten ---------- */
const CATS = [
  {id:'konzepte', title:'Säure-Base-Konzepte', sub:'Arrhenius oder Brönsted, Säure, Base oder Ampholyt, Protolysegleichungen, Säure-Base-Paare', items:'1–9'},
  {id:'staerke', title:'Starke und schwache Säuren', sub:'Protolysegleichgewicht, Kₛ und pKₛ, Säurestärke ordnen', items:'10–15'},
  {id:'ph', title:'pH-Wert und Oxonium-Ionen', sub:'pH ↔ c(H₃O⁺), pH-Werte schwacher Säuren, Verdünnen', items:'16–20', ready:true},
  {id:'titration', title:'Titration mit Indikator', sub:'Äquivalenzpunkt, Indikatorwahl, Konzentration bestimmen', items:'21–27'},
  {id:'phmetrisch', title:'pH-metrische Titration', sub:'Titrationskurven lesen und deuten', items:'28–40'},
  {id:'mix', title:'Klausurtraining', sub:'Gemischte Aufgaben mit Auswertung nach Ich-kann-Punkten', items:'alle'}
];
const ITEMS = {
  16:'…erklären, was der pH-Wert einer Lösung angibt.',
  17:'…pH-Werte starker Säuren ausgehend von ihrer Konzentration berechnen.',
  18:'…ausgehend von einem gegebenen pH-Wert die Konzentration einer starken Säure berechnen.',
  19:'…den pH-Wert schwacher Säuren berechnen.',
  20:'…erklären, warum eine schwache Säure bei gleicher Ausgangskonzentration einen höheren pH-Wert besitzt als eine starke Säure.'
};
const WEAK = [
  {n:'Essigsäure', f:'CH<sub>3</sub>COOH', pks:4.75},
  {n:'Ameisensäure', f:'HCOOH', pks:3.75},
  {n:'Benzoesäure', f:'C<sub>6</sub>H<sub>5</sub>COOH', pks:4.20},
  {n:'Milchsäure', f:'CH<sub>3</sub>CH(OH)COOH', pks:3.86},
  {n:'Propansäure', f:'C<sub>2</sub>H<sub>5</sub>COOH', pks:4.87},
  {n:'Flusssäure', f:'HF', pks:3.17}
];
const H3O = 'c(H<sub>3</sub>O<sup>+</sup>)';

/* ---------- Generatoren ---------- */
function genC2pH(){
  const acid = rnd(['Salzsäure','Salpetersäure']);
  const m = rnd([1,1.5,2,2.5,3,4,5,6,7.5,8]); const n = rnd([-1,-2,-3,-4]);
  const c = m*Math.pow(10,n); const pH = -lg(c);
  return {
    stem:`Berechne den pH-Wert einer ${acid} mit c(Säure) = ${conc(c)}.`,
    options: pick({html:'pH = '+num(pH)}, [
      {html:'pH = '+num(lg(c)), why:'Das Minuszeichen fehlt: pH = <b>−</b>lg '+H3O+'.'},
      {html:'pH = '+num(14-pH), why:'Das wäre richtig, wenn die Konzentration c(OH<sup>−</sup>) wäre. Hier ist es aber eine Säure, also '+H3O+'.'},
      {html:'pH = '+num(-Math.log(c)), why:'Hier wurde ln statt lg verwendet. Der pH-Wert ist über den dekadischen Logarithmus definiert.'},
      {html:'pH = '+num(-n), why:'Hier wurde nur der Exponent abgelesen und der Vorfaktor ignoriert.'}
    ]),
    sol:`Starke Säure → vollständige Protolyse: ${H3O} = c₀ = ${conc(c)}<br>pH = −lg(${pot(c)}) = <b>${num(pH)}</b>`,
    ph:pH
  };
}
function genPH2C(){
  const pH = Math.round((0.5+Math.random()*4.5)*10)/10; const c = Math.pow(10,-pH);
  return {
    stem:`Eine Salzsäure hat den pH-Wert ${num(pH,1)}. Berechne die Konzentration der Salzsäure.`,
    options: pick({html:'c(HCl) = '+conc(c)}, [
      {html:'c(HCl) = '+conc(Math.pow(10,pH)), why:'Das Vorzeichen im Exponenten fehlt: c = 10<sup>−pH</sup>.'},
      {html:'c(HCl) = '+conc(Math.pow(10,-(14-pH))), why:'Das ist c(OH<sup>−</sup>) der Lösung, nicht '+H3O+'.'},
      {html:'c(HCl) = '+conc(Math.exp(-pH)), why:'Hier wurde e<sup>−pH</sup> gerechnet, also ln mit lg verwechselt.'},
      {html:'c(HCl) = '+conc(1/pH), why:'Hier wurde der Kehrwert des pH-Werts gebildet. Richtig ist die Zehnerpotenz 10<sup>−pH</sup>.'}
    ]),
    sol:`${H3O} = 10<sup>−pH</sup> mol/L = 10<sup>−${num(pH,1)}</sup> mol/L = ${conc(c)}<br>Starke Säure, vollständig protolysiert → <b>c(HCl) = ${conc(c)}</b>`,
    ph:pH
  };
}
function genWeak(){
  const a = rnd(WEAK); const c0 = rnd([0.5,0.1,0.05,0.01]);
  const pH = 0.5*(a.pks - lg(c0));
  return {
    stem:`Berechne den pH-Wert einer ${a.n}-Lösung (${a.f}) mit c₀ = ${dec(c0)} mol/L. pKₛ = ${num(a.pks)}`,
    options: pick({html:'pH = '+num(pH)}, [
      {html:'pH = '+num(a.pks-lg(c0)), why:'Der Faktor ½ fehlt: pH = <b>½</b> · (pKₛ − lg c₀).'},
      {html:'pH = '+num(-lg(c0)), why:'Die Säure wurde wie eine starke Säure behandelt. Schwache Säuren protolysieren nur zu einem kleinen Teil, daher ist '+H3O+' viel kleiner als c₀.'},
      {html:'pH = '+num(0.5*(a.pks+lg(c0))), why:'Vorzeichenfehler: Es heißt pKₛ <b>−</b> lg c₀.'},
      {html:'pH = '+num(0.5*a.pks), why:'Die Konzentration wurde nicht berücksichtigt.'}
    ]),
    sol:`pH = ½ · (pKₛ − lg c₀)<br>pH = ½ · (${num(a.pks)} − (${num(lg(c0))})) = <b>${num(pH)}</b>`,
    ph:pH
  };
}
const CONCEPT = [
  {q:'Was gibt der pH-Wert einer Lösung an?',
   c:'den negativen dekadischen Logarithmus des Zahlenwerts der Oxonium-Ionen-Konzentration',

function genLowest(){
  for (let t=0;t<40;t++){
    const set = [];
    const nStrong = rnd([1,2]);
    for (let i=0;i<nStrong;i++){ const c = rnd([0.01,0.001,0.0001]); set.push({name:'Salzsäure', c, pH:-lg(c)}); }
    while (set.length<4){ const a = rnd(WEAK); const c = rnd([1,0.5,0.1]); set.push({name:a.n, c, pH:0.5*(a.pks-lg(c)), pks:a.pks}); }
    const keys = new Set(set.map(s=>s.name+s.c)); if (keys.size<4) continue;
    const sorted = set.slice().sort((x,y)=>x.pH-y.pH);
    if (sorted[1].pH-sorted[0].pH < 0.15) continue;
    const lab = s => `${s.name}, c₀ = ${dec(s.c)} mol/L${s.pks?` (pKₛ = ${num(s.pks)})`:''}`;
    const best = sorted[0];
    const opts = shuffle(set.map(s => s===best ? {html:lab(s), correct:true} : {html:lab(s), why:`Diese Lösung hat pH = ${num(s.pH)} und ist damit nicht die sauerste.`}));
    return {
      stem:'Welche Lösung hat den niedrigsten pH-Wert?', options:opts,
      sol: sorted.map(s=>`${s.name} (${dec(s.c)} mol/L): pH = ${num(s.pH)}`).join('<br>') + (best.pks?'<br>Die schwache Säure gewinnt hier, weil ihre Konzentration viel höher ist.':''),
      ph:best.pH
    };
  }
  return fromPool(COMPARE);
}

      {html:`${src(r.a)} + ${lq(sH2O)}${EQ}${aq(sH3O)} + ${aq(r.bw)}`, why:'Ladungsfehler: Gibt ein Teilchen ein Proton (H<sup>+</sup>) ab, sinkt seine Ladung um eins.'}
    ];
    if (r.all) d.push({html:r.all, why:'Mehrprotonige Säuren protolysieren stufenweise. Gefragt ist ein einzelner Protolyseschritt.'});
    return {
      stem:`Welche Gleichung beschreibt die Reaktion von ${r.a} als Säure mit Wasser${r.st?` (${r.st})`:''} richtig?`,
      options: pick({html:ok}, d),
      sol:`${r.a} gibt ein Proton an ${sH2O} ab:<br>${ok}`
    };
  }
  const r = rnd(BASE_RX);
  const ok = `${aq(r.b)} + ${lq(sH2O)}${EQ}${aq(r.hb)} + ${aq(sOH)}`;
  return {
    stem:`Welche Gleichung beschreibt die Reaktion von ${r.b} als Base mit Wasser richtig?`,
    options: pick({html:ok}, [
      {html:`${aq(r.b)} + ${lq(sH2O)}${EQ}${aq(r.hb)} + ${aq(sH3O)}`, why:'Wasser gibt hier als Säure ein Proton ab und wird dadurch zu OH<sup>−</sup>, nicht zu H<sub>3</sub>O<sup>+</sup>.'},
      {html:`${aq(r.b)} + ${lq(sH2O)}${EQ}${aq(r.hbw)} + ${aq(sOH)}`, why:'Ladungsfehler: Nimmt ein Teilchen ein Proton (H<sup>+</sup>) auf, steigt seine Ladung um eins.'},
      {html:`${aq(r.b)} + ${aq('H<sup>+</sup>')}${TO}${aq(r.hb)}`, why:'In wässriger Lösung gibt es keine freien Protonen. Gefragt ist die Reaktion mit Wasser als Protonendonator.'}
    ]),
    sol:`${r.b} nimmt ein Proton von ${sH2O} auf:<br>${ok}`
  };
}

/* Korrespondierende Säure-Base-Paare: S1 + B2 ⇌ S2 + B1 */
function allReactions(){
  const L = [];
  ACID_RX.forEach(r => L.push({eq:`${src(r.a)} + ${lq(sH2O)}${EQ}${aq(sH3O)} + ${aq(r.b)}`, S1:r.a, B2:sH2O, S2:sH3O, B1:r.b}));
  BASE_RX.forEach(r => L.push({eq:`${aq(r.b)} + ${lq(sH2O)}${EQ}${aq(r.hb)} + ${aq(sOH)}`, S1:sH2O, B2:r.b, S2:r.hb, B1:sOH}));
  L.push({eq:`HCl(aq) + NH<sub>3</sub>(aq)${TO}NH<sub>4</sub><sup>+</sup>(aq) + Cl<sup>−</sup>(aq)`, S1:'HCl', B2:'NH<sub>3</sub>', S2:'NH<sub>4</sub><sup>+</sup>', B1:'Cl<sup>−</sup>'});
  L.push({eq:`CH<sub>3</sub>COOH(aq) + ${aq(sOH)}${TO}CH<sub>3</sub>COO<sup>−</sup>(aq) + ${lq(sH2O)}`, S1:'CH<sub>3</sub>COOH', B2:sOH, S2:sH2O, B1:'CH<sub>3</sub>COO<sup>−</sup>'});
  L.push({eq:`${aq(sH3O)} + ${aq(sOH)}${TO}${lq(sH2O)} + ${lq(sH2O)}`, S1:sH3O, B2:sOH, S2:sH2O, B1:sH2O});
  L.push({eq:`NH<sub>4</sub><sup>+</sup>(aq) + ${aq(sOH)}${EQ}NH<sub>3</sub>(aq) + ${lq(sH2O)}`, S1:'NH<sub>4</sub><sup>+</sup>', B2:sOH, S2:sH2O, B1:'NH<sub>3</sub>'});
  L.push({eq:`HCO<sub>3</sub><sup>−</sup>(aq) + ${aq(sH3O)}${EQ}H<sub>2</sub>CO<sub>3</sub>(aq) + ${lq(sH2O)}`, S1:sH3O, B2:'HCO<sub>3</sub><sup>−</sup>', S2:'H<sub>2</sub>CO<sub>3</sub>', B1:sH2O});
  return L;
}
const REACTIONS = allReactions();
function genPair(){
  const r = rnd(REACTIONS);
  const first = Math.random() < 0.5;
  const tS = first ? r.S1 : r.S2, tB = first ? r.B1 : r.B2;
  const pr = (x,y) => `${x} / ${y}`;
  return {
    stem:`${r.eq}<br>Welches Teilchenpaar ist ein korrespondierendes Säure-Base-Paar dieser Reaktion? (Schreibweise: Säure / Base)`,
    options: pick({html:pr(tS,tB)}, [
      {html:pr(r.S1,r.B2), why:'Das sind die beiden Reaktionspartner: Säure und Base, die miteinander reagieren. Ein korrespondierendes Paar unterscheidet sich dagegen um genau ein Proton.'},
      {html:pr(r.S1,r.S2), why:'Beide Teilchen reagieren hier als Säure. Ein Paar besteht aus einer Säure und der Base, die nach Abgabe des Protons entsteht.'},
      {html:pr(r.B2,r.B1), why:'Beide Teilchen reagieren hier als Base. Ein Paar besteht aus einer Säure und der Base, die nach Abgabe des Protons entsteht.'},
      {html:pr(tB,tS), why:'Säure und Base sind vertauscht. Die Säure ist das Teilchen mit dem zusätzlichen Proton.'}
    ]),
    sol:`Paar 1: ${pr(r.S1,r.B1)}<br>Paar 2: ${pr(r.S2,r.B2)}<br>Die Teilchen eines Paares unterscheiden sich jeweils um genau ein Proton (H<sup>+</sup>).`,
    item: 7
  };
}

/* Teilchenbilder */
const P = {
  ha:(x,y)=>`<circle class="pc-a" cx="${x}" cy="${y}" r="7"/><circle class="pc-h" cx="${x+7.5}" cy="${y-5}" r="3.5"/>`,
  a:(x,y)=>`<circle class="pc-a" cx="${x}" cy="${y}" r="7"/><text class="pc-q" x="${x+9}" y="${y-5}">−</text>`,
  h3o:(x,y)=>{ let o=''; [-90,30,150].forEach(w=>{ const r=w*Math.PI/180; o+=`<circle class="pc-h" cx="${(x+8*Math.cos(r)).toFixed(1)}" cy="${(y+8*Math.sin(r)).toFixed(1)}" r="3.5"/>`; });
    return o+`<circle class="pc-o" cx="${x}" cy="${y}" r="6"/><text class="pc-q" x="${x+11}" y="${y-6}">+</text>`; }

function beaker(ha, h, a){
  const slots = shuffle([...Array(24).keys()]); let k = 0, out = '';
  const pos = () => { const s = slots[k++]; return [18 + (s%6)*26, 18 + Math.floor(s/6)*24]; };
  for (let i=0;i<ha;i++) out += P.ha(...pos());
  for (let i=0;i<h;i++) out += P.h3o(...pos());
  for (let i=0;i<a;i++) out += P.a(...pos());
  return `<svg class="beaker" viewBox="0 0 166 104" role="img" aria-label="${ha} HA, ${h} H3O+, ${a} A-"><rect x="1" y="1" width="164" height="102" rx="6" class="pc-box"/>${out}</svg>`;
}

  <span><svg viewBox="0 0 26 22" width="26" height="22">${P.a(10,12)}</svg>A<sup>−</sup></span>
  <span class="ldot"><svg viewBox="0 0 10 10" width="10" height="10"><circle class="pc-h" cx="5" cy="5" r="3.5"/></svg>H</span>

  <span class="lnote">Wassermoleküle sind nicht dargestellt.</span></span>`;

              : 'Starke Säure: Alle HA-Moleküle sind protolysiert. Es liegen nur H<sub>3</sub>O<sup>+</sup> und A<sup>−</sup> vor, das Gleichgewicht liegt vollständig auf der Produktseite.',
    item: weak ? 12 : 10
  };

function genStrengthConc(){
  for (let t=0;t<40;t++){
    const w = rnd(WEAK); const cw = rnd([1,0.5,0.1]); const cs = rnd([0.01,0.001,0.0001]);
    const pw = 0.5*(w.pks-lg(cw)), ps = -lg(cs);
    if (Math.abs(pw-ps) < 0.15) continue;
    const S = `Salzsäure (c₀ = ${dec(cs)} mol/L)`, Wn = `${w.n} (c₀ = ${dec(cw)} mol/L, pKₛ = ${num(w.pks)})`;
    const low = pw < ps ? 'W' : 'S';
    const nm = k => k==='S' ? 'die Salzsäure' : 'die '+w.n;
    const st = (x,y) => `${x==='S'?'Die Salzsäure':'Die '+w.n} hat den niedrigeren pH-Wert, ${y==='S'?'HCl':w.n} ist die stärkere Säure.`;
    const calc = `pH(Salzsäure) = ${num(ps)}, pH(${w.n}) = ½ · (${num(w.pks)} − (${num(lg(cw))})) = ${num(pw)}`;
    const opts = ['S','W'].flatMap(x => ['S','W'].map(y => {
      const ok = x===low && y==='S';
      const why = y!=='S' ? `HCl (pKₛ ≈ −6) ist die stärkere Säure, unabhängig von der Konzentration. ${w.n} hat pKₛ = ${num(w.pks)}.`
                          : `Rechne nach: ${calc}`;
      return ok ? {html:st(x,y), correct:true} : {html:st(x,y), why};
    }));
    return {
      stem:`Vergleiche zwei Lösungen:<br>① ${S}<br>② ${Wn}<br>Welche Aussage ist richtig?`,
      options: shuffle(opts),
      sol:`${calc}<br>Säurestärke: HCl > ${w.n}, weil der pKₛ-Wert von HCl kleiner ist. Den pH-Wert bestimmen Stärke <i>und</i> Konzentration.`,
      item:13
    };
  }
  return null;
}
function genKonz(){ const g = Math.random()<0.5 ? genStrengthConc() : null; if (g) return g; const q = rnd(KONZ); return {stem:q.q, options:pick({html:q.c}, q.d), sol:q.sol, item:13}; }

/* MWG, Kₛ und pKₛ */
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function genMWG(){
  const r = rnd(ACID_RX);
  const c = x => `c(${x})`;
  const ok = 'K<sub>S</sub> = '+frac(c(sH3O)+' · '+c(r.b), c(r.a));
  return {
    stem:`${src(r.a)} + ${lq(sH2O)}${EQ}${aq(sH3O)} + ${aq(r.b)}<br>Welcher Ausdruck beschreibt die Säurekonstante K<sub>S</sub>?`,
    options: pick({html:ok}, [
      {html:'K<sub>S</sub> = '+frac(c(r.a), c(sH3O)+' · '+c(r.b)), why:'Das ist der Kehrwert. Im Massenwirkungsgesetz stehen die Produkte im Zähler.'},
      {html:'K<sub>S</sub> = '+frac(c(sH3O)+' · '+c(r.b), c(r.a)+' · '+c(sH2O)), why:'Wasser liegt in großem Überschuss vor. c(H<sub>2</sub>O) ist praktisch konstant und wird in K<sub>S</sub> einbezogen.'},
      {html:'K<sub>S</sub> = '+frac(c(sH3O)+' + '+c(r.b), c(r.a)), why:'Im Massenwirkungsgesetz werden die Konzentrationen multipliziert, nicht addiert.'}
    ]),
    sol:`MWG: Produkte im Zähler, Edukte im Nenner, c(H<sub>2</sub>O) in K<sub>S</sub> einbezogen.<br>${ok}`,
    item:14
  };
}
function genKsConvert(){
  if (Math.random() < 0.5){
    const m = rnd([1,1.3,1.8,2.5,3.2,4.5,6.3,7.9]); const n = rnd([-2,-3,-4,-5,-6,-7,-8,-9,-10]);
    const ks = m*Math.pow(10,n); const pk = -lg(ks);
    return {
      stem:`Eine Säure hat K<sub>S</sub> = ${conc(ks)}. Berechne den pKₛ-Wert.`,
      options: pick({html:'pKₛ = '+num(pk)}, [
        {html:'pKₛ = '+num(lg(ks)), why:'Das Minuszeichen fehlt: pKₛ = <b>−</b>lg Kₛ.'},
        {html:'pKₛ = '+num(-Math.log(ks)), why:'Hier wurde ln statt lg verwendet.'},
        {html:'pKₛ = '+num(-n), why:'Hier wurde nur der Exponent abgelesen und der Vorfaktor ignoriert.'},
        {html:'pKₛ = '+num(14-pk), why:'Das ist der pK<sub>B</sub>-Wert der korrespondierenden Base (pKₛ + pK<sub>B</sub> = 14).'}
      ]),
      sol:`pKₛ = −lg Kₛ = −lg(${pot(ks)}) = <b>${num(pk)}</b>`, item:14
    };
  }
  const pk = Math.round((2+Math.random()*8)*10)/10; const ks = Math.pow(10,-pk);
  return {
    stem:`Eine Säure hat den pKₛ-Wert ${num(pk,1)}. Berechne K<sub>S</sub>.`,
    options: pick({html:'K<sub>S</sub> = '+conc(ks)}, [
      {html:'K<sub>S</sub> = '+conc(Math.pow(10,pk)), why:'Das Vorzeichen im Exponenten fehlt: Kₛ = 10<sup>−pKₛ</sup>.'},
      {html:'K<sub>S</sub> = '+conc(Math.exp(-pk)), why:'Hier wurde e<sup>−pKₛ</sup> gerechnet, also ln mit lg verwechselt.'},
      {html:'K<sub>S</sub> = '+conc(Math.pow(10,-(14-pk))), why:'Das ist K<sub>B</sub> der korrespondierenden Base.'}
    ]),
    sol:`Kₛ = 10<sup>−pKₛ</sup> mol/L = 10<sup>−${num(pk,1)}</sup> mol/L = <b>${conc(ks)}</b>`, item:14
  };
}

/* Säurestärke abschätzen */
function genRank(){
  const mode = rnd(['pks','pks','ks','order']);
  if (mode === 'order'){
    const set = shuffle(KS_ACIDS.slice()).slice(0,3);
    const asc = set.slice().sort((x,y)=>y.pks-x.pks); // schwächste zuerst
    const fmt = a => a.map(x=>x.f).join(' &lt; ');
    const wrong = shuffle([[asc[1],asc[0],asc[2]],[asc[0],asc[2],asc[1]],[asc[2],asc[0],asc[1]],[asc[1],asc[2],asc[0]]]).slice(0,2);
    return {
      stem:`Ordne nach <b>zunehmender</b> Säurestärke:<br>${set.map(x=>`${acidLab(x)}: pKₛ = ${num(x.pks)}`).join('<br>')}`,
      options: pick({html:fmt(asc)}, [
        {html:fmt(asc.slice().reverse()), why:'Das ist die Reihenfolge nach abnehmender Säurestärke. Je kleiner der pKₛ-Wert, desto stärker die Säure.'},
        ...wrong.map(w => ({html:fmt(w), why:'Vergleiche die pKₛ-Werte: Der größte pKₛ-Wert gehört zur schwächsten Säure, der kleinste zur stärksten.'}))
      ]),
      sol:`Je kleiner der pKₛ-Wert, desto stärker die Säure:<br>${asc.map(x=>`${x.f} (${num(x.pks)})`).join(' &lt; ')}`,
      item:15
    };
  }
  const set = shuffle(KS_ACIDS.slice()).slice(0,4);
  const strongest = Math.random() < 0.6;
  const sorted = set.slice().sort((x,y)=>x.pks-y.pks);
  const target = strongest ? sorted[0] : sorted[3];
  const useKs = mode === 'ks';
  const val = x => useKs ? `K<sub>S</sub> = ${conc(Math.pow(10,-x.pks))}` : `pKₛ = ${num(x.pks)}`;
  const opts = shuffle(set.map(x => x===target ? {html:`${acidLab(x)}: ${val(x)}`, correct:true}
    : {html:`${acidLab(x)}: ${val(x)}`, why: useKs
        ? `Großer Kₛ-Wert bedeutet starke Säure. ${target.f} hat den ${strongest?'größten':'kleinsten'} Kₛ-Wert.`
        : `Je kleiner der pKₛ-Wert, desto stärker die Säure. ${target.f} hat den ${strongest?'kleinsten':'größten'} pKₛ-Wert.`}));
  return {
    stem:`Welche Säure ist die <b>${strongest?'stärkste':'schwächste'}</b>?`,
    options: opts,
    sol: useKs ? `Großer Kₛ ↔ kleiner pKₛ ↔ starke Säure.<br>${sorted.map(x=>`${x.f}: pKₛ = ${num(x.pks)}`).join('<br>')}`
               : `Je kleiner der pKₛ-Wert, desto stärker die Säure:<br>${sorted.map(x=>`${x.f}: ${num(x.pks)}`).join(' &lt; ')}`,
    item:15
  };
}

const T_LABELS = ['Bürette','Maßlösung (bekannte Konzentration)','Hahn zum Dosieren','Erlenmeyerkolben','Probelösung mit Indikator','Magnetrührer mit Rührfisch','Stativ mit Bürettenklemme'];
function titrFig(){
  let ticks=''; for (let y=54;y<=204;y+=10) ticks += `<line x1="118" y1="${y}" x2="${(y-54)%50===0?124:121}" y2="${y}" class="tf-line"/>`;
  const marks = [[130,30,232,30],[130,130,232,130],[140,220,232,214],[139,262,232,250],[148,286,232,282],[170,306,232,312]];
  let lab=''; marks.forEach(([x1,y1,x2,y2],i)=>{ lab += `<line x1="${x1}" y1="${y1}" x2="${x2-9}" y2="${y2}" class="tf-lead"/><circle cx="${x2}" cy="${y2}" r="9" class="tf-num"/><text x="${x2}" y="${y2+4}" class="tf-numt">${i+1}</text>`; });
  lab += `<line x1="50" y1="180" x2="27" y2="180" class="tf-lead"/><circle cx="18" cy="180" r="9" class="tf-num"/><text x="18" y="184" class="tf-numt">7</text>`;
  return `<svg class="tfig" viewBox="0 0 252 334" role="img" aria-label="Versuchsaufbau einer Titration mit nummerierten Bauteilen">
    <rect x="30" y="318" width="170" height="8" rx="2" class="tf-metal"/>
    <rect x="50" y="14" width="5" height="304" class="tf-metal"/>
    <rect x="55" y="74" width="63" height="6" class="tf-metal"/>
    <rect x="114" y="70" width="20" height="14" rx="2" class="tf-clamp"/>
    <rect x="118" y="44" width="12" height="170" class="tf-mass"/>
    <rect x="118" y="14" width="12" height="200" class="tf-glass"/>
    ${ticks}
    <rect x="117" y="214" width="14" height="12" rx="2" class="tf-tap"/>
    <rect x="108" y="218" width="32" height="4" rx="2" class="tf-tap"/>
    <path d="M122 226 L122 240 L124 244 L126 240 L126 226" class="tf-glass"/>
    <rect x="78" y="294" width="92" height="24" rx="3" class="tf-stir"/>
    <circle cx="160" cy="306" r="4" class="tf-knob"/>
    <polygon points="100.3,276 147.7,276 160,294 88,294" class="tf-probe"/>
    <path d="M114 238 L114 256 L88 294 L160 294 L134 256 L134 238" class="tf-glass"/>
    <rect x="116" y="289" width="16" height="3" rx="1.5" class="tf-bar"/>
    ${lab}
  </svg>`;
}
function genSetupLabel(){
  const i = Math.floor(Math.random()*T_LABELS.length);
  const others = shuffle(T_LABELS.map((n,k)=>({n,k})).filter(o=>o.k!==i)).slice(0,3);
  return {
    stem:`<span class="figwrap">${titrFig()}</span>Welches Bauteil ist mit Nummer <b>${i+1}</b> gekennzeichnet?`,
    options: shuffle([{html:T_LABELS[i], correct:true}, ...others.map(o=>({html:o.n, why:`Das ist Nummer ${o.k+1}.`}))]),
    sol: T_LABELS.map((n,k)=>`${k+1} ${n}`).join('<br>'), item:22
  };
}

/* Neutralisationsgleichungen */
const T_ACIDS = [{n:'Salzsäure', x:'Cl<sup>−</sup>', s:'NaCl'}, {n:'Salpetersäure', x:'NO<sub>3</sub><sup>−</sup>', s:'NO<sub>3</sub>'}];
const T_BASES = [{n:'Natronlauge', m:'Na<sup>+</sup>', s:'Na'}, {n:'Kalilauge', m:'K<sup>+</sup>', s:'K'}];
function genNeutral(){
  const r = Math.random();
  if (r < 0.4){
    const A = rnd(T_ACIDS), B = rnd(T_BASES);
    const salt = B.s + (A.n==='Salzsäure' ? 'Cl' : 'NO<sub>3</sub>');
    const L = `${aq(sH3O)} + ${aq(A.x)} + ${aq(B.m)} + ${aq(sOH)}`;
    const ok = `${L}${TO}2 ${lq(sH2O)} + ${aq(B.m)} + ${aq(A.x)}`;
    return {
      stem:`Welche Gleichung beschreibt die Neutralisation von ${A.n} mit ${B.n} in Ionenschreibweise richtig?`,
      options: pick({html:ok}, [
        {html:`${L}${TO}2 ${lq(sH2O)} + ${salt}(s)`, why:`${salt} ist gut wasserlöslich. Die Ionen bleiben als Begleit-Ionen gelöst.`},
        {html:`${L}${TO}${lq(sH2O)} + ${aq(B.m)} + ${aq(A.x)}`, why:'Die Stoffbilanz stimmt nicht: Aus H<sub>3</sub>O<sup>+</sup> und OH<sup>−</sup> entstehen zwei Wassermoleküle.'},
        {html:`${L}${TO}${aq(sH3O)} + ${aq(sOH)} + ${B.s}${A.n==='Salzsäure'?'Cl':'NO<sub>3</sub>'}(aq)`, why:'Hier reagieren die Begleit-Ionen statt der Oxonium- und Hydroxid-Ionen. Die Neutralisation ist die Reaktion von H<sub>3</sub>O<sup>+</sup> mit OH<sup>−</sup>.'}
      ]),
      sol:`${ok}<br>Eigentliche Neutralisation: ${aq(sH3O)} + ${aq(sOH)}${TO}2 ${lq(sH2O)}`, item:23
    };
  }
  if (r < 0.65){
    const ok = `${aq(sH3O)} + ${aq(sOH)}${TO}2 ${lq(sH2O)}`;
    return {
      stem:'Welche Gleichung beschreibt die eigentliche Neutralisationsreaktion bei der Titration einer starken Säure mit Natronlauge?',
      options: pick({html:ok}, [
        {html:`${aq('Na<sup>+</sup>')} + ${aq('Cl<sup>−</sup>')}${TO}NaCl(s)`, why:'Na<sup>+</sup> und Cl<sup>−</sup> sind Begleit-Ionen. Sie nehmen an der Neutralisation nicht teil und bleiben gelöst.'},
        {html:`${aq(sH3O)} + ${aq(sOH)}${TO}${lq(sH2O)}`, why:'Die Stoffbilanz stimmt nicht: Es entstehen zwei Wassermoleküle.'},
        {html:`2 ${lq(sH2O)}${TO}${aq(sH3O)} + ${aq(sOH)}`, why:'Das ist die Autoprotolyse des Wassers, also die Umkehrung der Neutralisation.'}
      ]),
      sol:`${ok}<br>H<sub>3</sub>O<sup>+</sup> gibt ein Proton an OH<sup>−</sup> ab.`, item:23
    };
  }
  if (r < 0.85){
    const ok = `CH<sub>3</sub>COOH(aq) + ${aq(sOH)}${TO}CH<sub>3</sub>COO<sup>−</sup>(aq) + ${lq(sH2O)}`;
    return {
      stem:'Essigsäure wird mit Natronlauge titriert. Welche Gleichung beschreibt die Neutralisation am besten?',
      options: pick({html:ok}, [
        {html:`${aq(sH3O)} + ${aq(sOH)}${TO}2 ${lq(sH2O)}`, why:'Essigsäure ist eine schwache Säure und liegt überwiegend als Molekül vor. Die CH<sub>3</sub>COOH-Moleküle reagieren direkt mit den OH<sup>−</sup>-Ionen.'},
        {html:`CH<sub>3</sub>COO<sup>−</sup>(aq) + ${lq(sH2O)}${EQ}CH<sub>3</sub>COOH(aq) + ${aq(sOH)}`, why:'Das ist die Reaktion des Acetat-Ions als Base. Sie erklärt den pH-Wert am Äquivalenzpunkt, ist aber nicht die Neutralisation.'},
        {html:`CH<sub>3</sub>COOH(aq) + ${aq('Na<sup>+</sup>')}${TO}CH<sub>3</sub>COONa(s) + ${aq('H<sup>+</sup>')}`, why:'Na<sup>+</sup> ist ein Begleit-Ion und nimmt kein Proton auf. Der Protonenakzeptor ist OH<sup>−</sup>.'}
      ]),
      sol:`${ok}<br>Säure (CH<sub>3</sub>COOH) gibt ein Proton an die Base (OH<sup>−</sup>) ab.`, item:23
    };
  }
  return {
    stem:'In welchem Stoffmengenverhältnis reagieren Schwefelsäure (H<sub>2</sub>SO<sub>4</sub>) und Natriumhydroxid bis zum Äquivalenzpunkt?',
    options: pick({html:'n(H<sub>2</sub>SO<sub>4</sub>) : n(NaOH) = 1 : 2'}, [
      {html:'n(H<sub>2</sub>SO<sub>4</sub>) : n(NaOH) = 1 : 1', why:'Schwefelsäure ist zweiprotonig. Jedes Molekül gibt zwei Protonen ab und braucht zwei OH<sup>−</sup>-Ionen.'},
      {html:'n(H<sub>2</sub>SO<sub>4</sub>) : n(NaOH) = 2 : 1', why:'Das Verhältnis ist vertauscht. Pro H<sub>2</sub>SO<sub>4</sub> braucht man zwei NaOH.'},
      {html:'n(H<sub>2</sub>SO<sub>4</sub>) : n(NaOH) = 1 : 4', why:'H<sub>2</sub>SO<sub>4</sub> hat zwei abgebbare Protonen, nicht vier.'}
    ]),
    sol:`H<sub>2</sub>SO<sub>4</sub>(aq) + 2 NaOH(aq)${TO}Na<sub>2</sub>SO<sub>4</sub>(aq) + 2 ${lq(sH2O)}<br>Ionisch: 2 ${aq(sH3O)} + 2 ${aq(sOH)}${TO}4 ${lq(sH2O)}`, item:23
  };
}

/* Indikator wählen */
const INDIK = [

  {n:'Methylrot', lo:4.4, hi:6.2, c:'rot → gelb'},

  {n:'Thymolphthalein', lo:9.3, hi:10.5, c:'farblos → blau'}

const T_SCEN = [
  {t:'Salzsäure wird mit Natronlauge titriert (c jeweils 0,1 mol/L).', ph:7.0, extra:'Wegen des großen pH-Sprungs (etwa pH 4 bis 10) wären hier auch Methylrot oder Phenolphthalein noch brauchbar. Am besten passt aber Bromthymolblau.'},
  {t:'Essigsäure wird mit Natronlauge titriert (c jeweils 0,1 mol/L).', ph:8.7, extra:'Die Acetat-Ionen reagieren basisch, der Äquivalenzpunkt liegt im basischen Bereich.'},
  {t:'Ammoniak-Lösung wird mit Salzsäure titriert (c jeweils 0,1 mol/L).', ph:5.3, extra:'Die NH<sub>4</sub><sup>+</sup>-Ionen reagieren schwach sauer, der Äquivalenzpunkt liegt im sauren Bereich.'},
  {t:'Natriumhydrogencarbonat-Lösung wird mit Salzsäure titriert.', ph:3.8, extra:'Am Äquivalenzpunkt liegt Kohlensäure vor, die Lösung ist sauer.'}
];
function genIndicator(){
  let ph, intro, extra = '';
  if (Math.random() < 0.55){ const s = rnd(T_SCEN); ph = s.ph; intro = `${s.t} Der Äquivalenzpunkt liegt bei pH ≈ ${num(ph,1)}.`; extra = s.extra; }
  else { ph = rnd([3.5,4.0,4.9,5.6,6.6,7.2,8.5,9.0,10.2,10.4]); intro = `Bei einer Titration liegt der Äquivalenzpunkt bei pH ≈ ${num(ph,1)}.`; }
  const right = INDIK.find(i => ph>=i.lo && ph<=i.hi);
  const others = shuffle(INDIK.filter(i => i!==right)).slice(0,3);
  const lab = i => `${i.n} (pH ${num(i.lo,1)}–${num(i.hi,1)})`;
  return {
    stem:`${intro} Welcher Indikator ist am besten geeignet?`,
    options: shuffle([{html:lab(right), correct:true}, ...others.map(i => ({html:lab(i), why:`Der Umschlagsbereich ${num(i.lo,1)}–${num(i.hi,1)} enthält den pH-Wert am Äquivalenzpunkt (${num(ph,1)}) nicht. Der Farbumschlag läge ${i.hi<ph?'vor':'hinter'} dem Äquivalenzpunkt.`}))]),
    sol:`Der Umschlagsbereich muss den pH-Wert am Äquivalenzpunkt enthalten: ${right.n} (${num(right.lo,1)}–${num(right.hi,1)}, ${right.c}).${extra?'<br>'+extra:''}`,
    item:25
  };
}

function genIndik(){ if (Math.random()<0.7) return genIndicator(); const q = rnd(INDIK_POOL); return {stem:q.q, options:pick({html:q.c}, q.d), sol:q.sol, item:25}; }

/* Konzentration aus dem Verbrauch berechnen */
const T_CALC = [
  {n:'Salzsäure', f:'HCl', z:1},
  {n:'Essigsäure', f:'CH<sub>3</sub>COOH', z:1},
  {n:'Schwefelsäure', f:'H<sub>2</sub>SO<sub>4</sub>', z:2},
  {n:'Milchsäure', f:'CH<sub>3</sub>CH(OH)COOH', z:1, milk:true}
];
function genTitCalc(){
  const a = rnd(T_CALC);
  const VP = rnd([10,20,25]); const cM = rnd([0.1,0.2,0.05]); const VM = Math.round((6+Math.random()*16)*10)/10;
  const nM = cM*VM/1000, nS = nM/a.z, cS = nS/(VP/1000);
  const askC = Math.random() < 0.55;
  const probe = a.milk ? `${VP},0 mL Milch` : `${VP},0 mL ${a.n} (${a.f})`;
  const target = a.milk ? 'der Milchsäure in der Milch' : `der ${a.n}`;
  const stem = `Du titrierst ${probe} mit Natronlauge, c(NaOH) = ${dec(cM)} mol/L. Bis zum Farbumschlag verbrauchst du ${num(VM,1)} mL Natronlauge. Berechne ${askC?'die Stoffmengenkonzentration':'die Stoffmenge'} ${target}.`;
  const ratio = a.z===2 ? `n(H<sub>2</sub>SO<sub>4</sub>) = ½ · n(NaOH) = <b>${pot(nS)} mol</b>` : `n(${a.milk?'Milchsäure':a.f}) = n(NaOH) = ${pot(nS)} mol (Verhältnis 1 : 1)`;

  }
  const d = [
    {html:conc(cM*VP/VM/a.z), why:'Die Volumina sind vertauscht: c(Säure) = n(Säure) / V(Probe).'},

  if (a.z===2) d.push({html:conc(2*cS), why:'Schwefelsäure ist zweiprotonig: n(H<sub>2</sub>SO<sub>4</sub>) = ½ · n(NaOH).'});
  return {
    stem, options:pick({html:conc(cS)}, d),
    sol:`${step1}<br>${ratio}<br>c = n / V(Probe) = ${pot(nS)} mol / (${VP} · 10<sup>−3</sup> L) = <b>${conc(cS)}</b>`, item:26
  };
}

/* ========== Kategorie 5: pH-metrische Titration ========== */
/* exakte Titrationskurve über die Ladungsbilanz (Säure HnA mit NaOH) */
function phAt(pks, ca, Va, cb, Vb){
  const V = (Va+Vb)/1000, C = ca*Va/1000/V, Na = cb*Vb/1000/V, Ka = pks.map(p=>Math.pow(10,-p));
  const f = pH => {
    const h = Math.pow(10,-pH), oh = 1e-14/h;
    const t = [1]; let pr = 1; Ka.forEach(k => { pr *= k/h; t.push(pr); });
    const sum = t.reduce((a,b)=>a+b,0); let ch = 0; t.forEach((x,i)=> ch += i*x/sum);
    return h + Na - oh - C*ch;
  };
  let lo = 0, hi = 14;
  for (let i=0;i<60;i++){ const m = (lo+hi)/2; if (f(m) > 0) lo = m; else hi = m; }
  return (lo+hi)/2;
}
const HCL = {n:'Salzsäure', f:'HCl', pks:[-6]};
const H3PO4 = {n:'Phosphorsäure', f:'H<sub>3</sub>PO<sub>4</sub>', pks:[2.13,7.21,12.32]};
const weakAcid = () => { const a = rnd(WEAK); return {n:a.n, f:a.f, pks:[a.pks]}; };

function plot(spec){
  const {vmax, lines, marks=[], Va=20, cb=0.1} = spec;
  const L=44, R=350, T=12, B=204;
  const sx = v => L + v/vmax*(R-L), sy = p => B - p/14*(B-T);
  const vstep = vmax > 40 ? 10 : 5;
  let g = '';
  for (let p=0;p<=14;p+=1) g += `<line x1="${L}" x2="${R}" y1="${sy(p).toFixed(1)}" y2="${sy(p).toFixed(1)}" class="${p%2?'ch-grid2':'ch-grid'}"/>`;
  for (let v=0; v<=vmax+0.01; v+=vstep/2) g += `<line y1="${T}" y2="${B}" x1="${sx(v).toFixed(1)}" x2="${sx(v).toFixed(1)}" class="${(v/vstep)%1?'ch-grid2':'ch-grid'}"/>`;
  let ticks = '';
  for (let p=0;p<=14;p+=2) ticks += `<text x="${L-6}" y="${(sy(p)+3.5).toFixed(1)}" class="ch-tick" text-anchor="end">${p}</text>`;
  for (let v=0; v<=vmax+0.01; v+=vstep) ticks += `<text x="${sx(v).toFixed(1)}" y="${B+14}" class="ch-tick" text-anchor="middle">${v}</text>`;
  let paths = '';
  lines.forEach((ln,k) => {
    let d = ''; const N = 320;
    for (let i=0;i<=N;i++){ const v = vmax*i/N; const p = phAt(ln.pks, ln.ca, Va, cb, v); d += (i?'L':'M')+sx(v).toFixed(1)+' '+sy(p).toFixed(1); }
    paths += `<path d="${d}" class="ch-line${ln.alt?' alt':''}"/>`;
    if (ln.label) paths += `<text x="${sx(vmax*0.3).toFixed(1)}" y="${(sy(phAt(ln.pks, ln.ca, Va, cb, vmax*0.3))-9).toFixed(1)}" class="ch-lab${ln.alt?' alt':''}" text-anchor="middle">${ln.label}</text>`;
  });
  let mk = '';
  marks.forEach(m => {
    const p = phAt(lines[0].pks, lines[0].ca, Va, cb, m.v); const x = sx(m.v), y = sy(p);
    mk += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" class="ch-mk"/><text x="${(m.v<vmax*0.05?x+8:x-8).toFixed(1)}" y="${(y-8).toFixed(1)}" class="ch-mkt" text-anchor="${m.v<vmax*0.05?'start':'end'}">${m.label}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 360 236" role="img" aria-label="Titrationskurve: pH gegen Volumen Natronlauge">
    ${g}<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" class="ch-axis"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" class="ch-axis"/>
    ${ticks}<text x="${(L+R)/2}" y="232" class="ch-title" text-anchor="middle">V(NaOH) in mL, c(NaOH) = ${dec(cb)} mol/L</text>
    <text x="12" y="${(T+B)/2}" class="ch-title" text-anchor="middle" transform="rotate(-90 12 ${(T+B)/2})">pH</text>
    ${paths}${mk}</svg>`;
}
const chartBox = (svg, cap) => `<span class="chartwrap">${svg}${cap?`<span class="chcap">${cap}</span>`:''}</span>`;
const roundUp = (x,s) => Math.ceil(x/s)*s;

/* Kurve lesen */
function genCurve(){
  const strong = Math.random() < 0.25;
  const acid = strong ? HCL : weakAcid();
  const ca = rnd([0.1,0.05,0.08,0.12]); const Va = 20, cb = 0.1;
  const Veq = ca*Va/cb; const vmax = roundUp(Veq*1.6,5);
  const ph = v => phAt(acid.pks, ca, Va, cb, v);
  const intro = `${Va} mL einer Säure wurden mit Natronlauge (c = ${dec(cb)} mol/L) titriert.`;
  const types = strong ? ['aep','conc'] : ['aep','conc','points','pks','which'];
  const t = rnd(types);
  if (t === 'aep'){
    let d = [
      {html:`V = ${num(Veq/2,1)} mL`, why:'Das ist der Halbäquivalenzpunkt. Der Äquivalenzpunkt liegt in der Mitte des steilen pH-Sprungs.'},
      {html:`V = ${num(Veq*1.5,1)} mL`, why:'Hier ist der Sprung schon vorbei. Der Äquivalenzpunkt liegt in der Mitte des steilen Anstiegs.'}
    ];
    if (!strong){ let lo=0, hi=Veq; for (let i=0;i<50;i++){ const m=(lo+hi)/2; if (ph(m)<7) lo=m; else hi=m; } if (Veq-lo > 0.4) d.push({html:`V = ${num(lo,1)} mL`, why:'Hier ist pH = 7 erreicht. Bei einer schwachen Säure liegt der Äquivalenzpunkt aber im basischen Bereich.'}); }
    d.push({html:`V = ${num(Veq*0.8,1)} mL`, why:'Der Anstieg beginnt hier erst. Der Äquivalenzpunkt ist der Wendepunkt in der Mitte des Sprungs.'});
    return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}], Va, cb}))+`${intro} Bei welchem Volumen liegt der Äquivalenzpunkt?`,
      options:pick({html:`V = ${num(Veq,1)} mL`}, d),
      sol:`Äquivalenzpunkt = Wendepunkt im steilsten Bereich des Sprungs: V ≈ ${num(Veq,1)} mL, pH ≈ ${num(ph(Veq),1)}.`, item:32 };
  }
  if (t === 'conc'){
    const c = ca;
    return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}], Va, cb}))+`${intro} Bestimme die Konzentration der Säure (einprotonig).`,
      options:pick({html:conc(c)}, [
        {html:conc(cb*Va/Veq), why:'Die Volumina sind vertauscht: c(Säure) = c(NaOH) · V(ÄP) / V(Probe).'},
        {html:conc(cb*Veq/2/Va), why:'Hier wurde das Volumen am Halbäquivalenzpunkt verwendet. Entscheidend ist der Äquivalenzpunkt.'},
        {html:conc(cb), why:'Das ist die Konzentration der Natronlauge. Die Konzentration der Säure folgt aus V(ÄP).'},
        {html:conc(cb*Veq*1.5/Va), why:'Lies den Äquivalenzpunkt in der Mitte des Sprungs ab, nicht am Ende.'}
      ]),
      sol:`V(ÄP) ≈ ${num(Veq,1)} mL → n(NaOH) = ${dec(cb)} mol/L · ${num(Veq,1)} · 10<sup>−3</sup> L = ${pot(cb*Veq/1000)} mol = n(Säure)<br>c(Säure) = n / V(Probe) = ${pot(cb*Veq/1000)} mol / 0,020 L = <b>${conc(c)}</b>`, item:39 };
  }
  if (t === 'points'){
    const roles = shuffle([{k:'start', v:0, nm:'Anfangspunkt'}, {k:'half', v:Veq/2, nm:'Halbäquivalenzpunkt'}, {k:'aep', v:Veq, nm:'Äquivalenzpunkt'}, {k:'after', v:Math.min(Veq*1.45, vmax*0.95), nm:'Punkt im Überschuss an Natronlauge'}]);
    roles.forEach((r,i) => r.label = 'ABCD'[i]);
    const target = rnd(roles.filter(r => r.k!=='after'));
    const marks = roles.slice().sort((a,b)=>a.v-b.v).map(r => ({v:r.v, label:r.label}));
    const itm = {start:34, half:33, aep:32}[target.k];
    return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}], marks, Va, cb}))+`Titration einer schwachen Säure mit Natronlauge. Welcher Punkt ist der <b>${target.nm}</b>?`,
      options: roles.slice().sort((a,b)=>a.label<b.label?-1:1).map(r => r===target ? {html:`Punkt ${r.label}`, correct:true} : {html:`Punkt ${r.label}`, why:`Punkt ${r.label} ist der ${r.nm}.`}),
      sol: roles.slice().sort((a,b)=>a.v-b.v).map(r=>`${r.label}: ${r.nm}`).join('<br>'), item:itm };
  }
  if (t === 'pks'){
    const pk = ph(Veq/2), p0 = ph(0), pe = ph(Veq);
    const d = [{html:`pKₛ ≈ ${num(p0,1)}`, why:'Das ist der Anfangs-pH. Den pKₛ-Wert liest man am Halbäquivalenzpunkt ab.'},
               {html:`pKₛ ≈ ${num(pe,1)}`, why:'Das ist der pH-Wert am Äquivalenzpunkt. Den pKₛ-Wert liest man am Halbäquivalenzpunkt ab.'},
               {html:`pKₛ ≈ ${num(14-pk,1)}`, why:'Hier wurde 14 − pH gerechnet. Am Halbäquivalenzpunkt gilt direkt pH = pKₛ.'}].filter(o => Math.abs(parseFloat(o.html.split('≈ ')[1].replace(',','.').replace('−','-'))-pk) > 0.4);
    return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}], Va, cb}))+`${intro} Bestimme aus der Kurve den pKₛ-Wert der Säure.`,
      options:pick({html:`pKₛ ≈ ${num(pk,1)}`}, d),
      sol:`V(ÄP) ≈ ${num(Veq,1)} mL → Halbäquivalenzpunkt bei ${num(Veq/2,1)} mL.<br>Dort gilt c(HA) = c(A<sup>−</sup>), also pH = pKₛ ≈ <b>${num(pk,1)}</b>.`, item:33 };
  }
  // which
  const pk = acid.pks[0];
  const others = shuffle(WEAK.filter(w => Math.abs(w.pks-pk) >= 0.3)).slice(0,3);
  return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}], Va, cb}))+`${intro} Um welche Säure handelt es sich?`,
    options: shuffle([{html:`${acid.n} (pKₛ = ${num(pk)})`, correct:true}, ...others.map(w => ({html:`${w.n} (pKₛ = ${num(w.pks)})`, why:`Am Halbäquivalenzpunkt (V ≈ ${num(Veq/2,1)} mL) liest man pH ≈ ${num(ph(Veq/2),1)} ab. Das passt nicht zu pKₛ = ${num(w.pks)}.`}))]),
    sol:`Halbäquivalenzpunkt bei V ≈ ${num(Veq/2,1)} mL: pH = pKₛ ≈ ${num(ph(Veq/2),1)} → ${acid.n}`, item:39 };
}

function genCompare(){
  if (Math.random() < 0.35){ const q = rnd(VERGLEICH); return {stem:q.q, options:pick({html:q.c}, q.d), sol:q.sol, item:q.item}; }
  if (Math.random() < 0.3){
    const w = weakAcid();
    return { stem:chartBox(plot({vmax:30, lines:[{pks:HCL.pks, ca:0.1, label:'A'}, {pks:w.pks, ca:0.1, alt:true, label:'B'}]}))+`Zwei Säuren (je 20 mL, c = 0,1 mol/L) wurden titriert. Welche Aussage ist richtig?`,
      options:pick({html:'A ist die starke Säure, B die schwache: B startet höher, hat einen Pufferbereich und einen Äquivalenzpunkt im Basischen.'}, [
        {html:'B ist die starke Säure, weil ihr Äquivalenzpunkt höher liegt.', why:'Ein Äquivalenzpunkt im basischen Bereich ist typisch für eine schwache Säure.'},
        {html:'A ist die schwache Säure, weil ihr Sprung größer ist.', why:'Ein großer Sprung und niedriger Anfangs-pH sind typisch für eine starke Säure.'},
        {html:'Beide Säuren sind gleich stark, weil der Äquivalenzpunkt beim gleichen Volumen liegt.', why:'Das Volumen zeigt nur die gleiche Stoffmenge. Die Stärke erkennt man am Kurvenverlauf.'}
      ]),
      sol:`${KURVE_DESC.strong}<br>${KURVE_DESC.weak}`, item:38 };
  }
  const k = rnd(['strong','weak','weak','poly']);
  const acid = k==='strong' ? HCL : k==='poly' ? H3PO4 : weakAcid();
  const ca = k==='poly' ? 0.05 : 0.1; const vmax = k==='poly' ? 30 : 30;
  return { stem:chartBox(plot({vmax, lines:[{pks:acid.pks, ca}]}))+'Welche Art von Säure wurde hier titriert (20 mL Probe)?',
    options:['strong','weak','poly'].map(x => x===k ? {html:KURVE_LAB[x], correct:true} : {html:KURVE_LAB[x], why:KURVE_DESC[k]}),
    sol:KURVE_DESC[k]+` (Hier: ${acid.n})`, item:38 };
}

/* Mehrprotonige Säuren */
function genPoly(){
  const ca = rnd([0.05,0.04,0.06]); const Va = 20, cb = 0.1; const V1 = ca*Va/cb, V2 = 2*V1; const vmax = roundUp(V2*1.25,5);
  const ph = v => phAt(H3PO4.pks, ca, Va, cb, v);
  const t = rnd(['particles','conc','pks2','why','ratio']);
  const fig = marks => chartBox(plot({vmax, lines:[{pks:H3PO4.pks, ca}], marks, Va, cb}));
  const intro = `${Va} mL Phosphorsäure wurden mit Natronlauge titriert.`;
  if (t === 'particles'){
    const P = [
      {v:0, t:'H<sub>3</sub>PO<sub>4</sub>-Moleküle', e:'Am Anfang liegt nur Phosphorsäure vor.'},
      {v:V1, t:'H<sub>2</sub>PO<sub>4</sub><sup>−</sup>-Ionen', e:'Am 1. Äquivalenzpunkt hat jedes H<sub>3</sub>PO<sub>4</sub> ein Proton abgegeben.'},
      {v:1.5*V1, t:'H<sub>2</sub>PO<sub>4</sub><sup>−</sup> und HPO<sub>4</sub><sup>2−</sup> in gleicher Konzentration', e:'Das ist der 2. Halbäquivalenzpunkt: Die Hälfte des H<sub>2</sub>PO<sub>4</sub><sup>−</sup> ist zu HPO<sub>4</sub><sup>2−</sup> umgesetzt.'},
      {v:V2, t:'HPO<sub>4</sub><sup>2−</sup>-Ionen', e:'Am 2. Äquivalenzpunkt hat jedes H<sub>3</sub>PO<sub>4</sub> zwei Protonen abgegeben.'}
    ];
    const k = rnd(P);
    return { stem:fig([{v:k.v, label:'X'}])+`${intro} Welche phosphorhaltigen Teilchen liegen an Punkt X überwiegend vor?`,
      options: P.map(p => p===k ? {html:p.t, correct:true} : {html:p.t, why:k.e}),
      sol:k.e, item:40 };
  }
  if (t === 'conc'){
    const c = ca;
    return { stem:fig([])+`${intro} c(NaOH) = ${dec(cb)} mol/L. Bestimme die Konzentration der Phosphorsäure.`,
      options:pick({html:conc(c)}, [
        {html:conc(cb*V2/Va), why:'Am 2. Äquivalenzpunkt haben zwei Protonen pro Molekül reagiert. Mit V(ÄP<sub>2</sub>) gilt n(H<sub>3</sub>PO<sub>4</sub>) = ½ · n(NaOH).'},
        {html:conc(cb*Va/V1), why:'Die Volumina sind vertauscht: c = c(NaOH) · V(ÄP<sub>1</sub>) / V(Probe).'},
        {html:conc(cb), why:'Das ist die Konzentration der Natronlauge.'}
      ]),
      sol:`1. Äquivalenzpunkt bei V ≈ ${num(V1,1)} mL: n(H<sub>3</sub>PO<sub>4</sub>) = n(NaOH) = ${pot(cb*V1/1000)} mol<br>c = ${pot(cb*V1/1000)} mol / 0,020 L = <b>${conc(c)}</b><br>(Alternativ: ½ · n(NaOH) am 2. Äquivalenzpunkt)`, item:40 };
  }
  if (t === 'pks2'){
    const pk = ph(1.5*V1);
    return { stem:fig([{v:1.5*V1, label:'X'}])+`${intro} Punkt X liegt genau zwischen dem 1. und 2. Äquivalenzpunkt. Was kann man dort ablesen?`,
      options:pick({html:`pKₛ₂ (H<sub>2</sub>PO<sub>4</sub><sup>−</sup>) ≈ ${num(pk,1)}`}, [
        {html:`pKₛ₁ (H<sub>3</sub>PO<sub>4</sub>) ≈ ${num(pk,1)}`, why:'Punkt X ist der 2. Halbäquivalenzpunkt. Hier gilt c(H<sub>2</sub>PO<sub>4</sub><sup>−</sup>) = c(HPO<sub>4</sub><sup>2−</sup>), also pH = pKₛ₂.'},
        {html:`den pH-Wert des 2. Äquivalenzpunkts (${num(pk,1)})`, why:'Der 2. Äquivalenzpunkt liegt erst in der Mitte des zweiten Sprungs.'},
        {html:`die Konzentration der Phosphorsäure (${num(pk,1)} mol/L)`, why:'Die Konzentration folgt aus dem Volumen am Äquivalenzpunkt, nicht aus dem pH-Wert.'}
      ]),
      sol:`2. Halbäquivalenzpunkt: c(H<sub>2</sub>PO<sub>4</sub><sup>−</sup>) = c(HPO<sub>4</sub><sup>2−</sup>) → pH = pKₛ₂ ≈ ${num(pk,1)} (Tabellenwert 7,21)`, item:40 };
  }
  if (t === 'ratio'){
    return { stem:fig([])+`${intro} Wie verhalten sich die Volumina am 1. und 2. Äquivalenzpunkt?`,
      options:pick({html:'V(ÄP<sub>2</sub>) = 2 · V(ÄP<sub>1</sub>)'}, [
        {html:'V(ÄP<sub>2</sub>) = V(ÄP<sub>1</sub>) + 1 mL', why:'Für die zweite Stufe braucht man genauso viel Natronlauge wie für die erste.'},
        {html:'V(ÄP<sub>2</sub>) = 3 · V(ÄP<sub>1</sub>)', why:'Bis zum 2. Äquivalenzpunkt haben zwei Protonen reagiert, nicht drei.'},
        {html:'V(ÄP<sub>2</sub>) = ½ · V(ÄP<sub>1</sub>)', why:'Der 2. Äquivalenzpunkt kommt nach dem ersten, er braucht also mehr Natronlauge.'}
      ]),
      sol:`Jede Stufe verbraucht n(NaOH) = n(H<sub>3</sub>PO<sub>4</sub>): V(ÄP<sub>1</sub>) ≈ ${num(V1,1)} mL, V(ÄP<sub>2</sub>) ≈ ${num(V2,1)} mL`, item:40 };
  }
  return { stem:fig([])+`${intro} Warum zeigt die Kurve zwei pH-Sprünge, obwohl H<sub>3</sub>PO<sub>4</sub> drei Protonen abgeben kann?`,
    options:pick({html:'Die Protonen werden stufenweise abgegeben, jede Stufe hat einen eigenen Äquivalenzpunkt. Der dritte Sprung fehlt, weil HPO<sub>4</sub><sup>2−</sup> eine sehr schwache Säure ist (pKₛ₃ = 12,32).'}, [
      {html:'Weil das dritte Proton nicht abgegeben werden kann, da H<sub>3</sub>PO<sub>4</sub> nur zweiprotonig ist.', why:'H<sub>3</sub>PO<sub>4</sub> ist dreiprotonig. Das dritte Proton wird mit Natronlauge aber nur unvollständig abgegeben.'},
      {html:'Weil die Natronlauge nicht ausgereicht hat.', why:'Auch bei mehr Natronlauge entsteht kein deutlicher dritter Sprung, da der pH dann schon um 12 liegt.'},
      {html:'Weil alle drei Protonen gleichzeitig abgegeben werden.', why:'Dann gäbe es nur einen Sprung. Die Stufen unterscheiden sich in ihren pKₛ-Werten.'}
    ]),
    sol:'pKₛ₁ = 2,13, pKₛ₂ = 7,21, pKₛ₃ = 12,32 → zwei sichtbare Sprünge', item:40 };
}

function genPrinzipPh(){
  if (Math.random() < 0.35){
    const i = Math.floor(Math.random()*PH_LABELS.length);
    const others = shuffle(PH_LABELS.map((n,k)=>({n,k})).filter(o=>o.k!==i)).slice(0,3);
    return { stem:`<span class="figwrap">${phFig()}</span>Welches Bauteil ist mit Nummer <b>${i+1}</b> gekennzeichnet?`,
      options: shuffle([{html:PH_LABELS[i], correct:true}, ...others.map(o=>({html:o.n, why:`Das ist Nummer ${o.k+1}.`}))]),
      sol: PH_LABELS.map((n,k)=>`${k+1} ${n}`).join('<br>'), item:29 };
  }
  const q = rnd(PRINZIP_PH); return {stem:q.q, options:pick({html:q.c}, q.d), sol:q.sol, item:q.item};
}

/* ---------- Ansicht ---------- */
let cur = { cat:null, ex:null, q:null, done:false, streak:0 };

function renderHome(){
  $('#back').hidden = true; $('#h1').textContent = 'Säuren und Basen';
  $('#view').innerHTML = `<div class="cats">${CATS.map(c=>{ const ready = !!CAT[c.id]; return `
    <button class="cat ${ready?'ready':''}" data-cat="${c.id}" ${ready?'':'disabled'}>
      <h2>${c.title}</h2><p>${c.sub}</p>
      <div class="meta"><span>Ich kann Nr. ${c.items}</span><span class="pill ${ready?'go':''}">${ready?'Üben':'folgt'}</span></div>
    </button>`; }).join('')}</div>
    <p class="home-note">Dein Fortschritt und deine Selbsteinschätzung werden in diesem Browser gespeichert. Auf einem anderen Gerät startest du neu.</p>`;
  document.querySelectorAll('.cat.ready').forEach(b => b.onclick = () => { location.hash = b.dataset.cat; });
}

function renderCat(id){
  const C = CAT[id];
  if (cur.cat !== id){ cur.cat = id; cur.ex = C.first; cur.streak = 0; }
  $('#back').hidden = false; $('#h1').textContent = C.title;
  $('#view').innerHTML = `<div class="layout">
    <main>
      <details class="info" id="info" open>
        <summary>Das Wichtigste in Kürze</summary>
        <div class="body">${C.info}</div>
      </details>
      <div class="tabs" role="tablist">${Object.entries(C.ex).map(([k,e])=>`
        <button class="tab" role="tab" data-ex="${k}" aria-selected="${k===cur.ex}"><span class="n">Nr. ${e.nr}</span><span class="t">${e.title}</span></button>`).join('')}</div>
      <section class="card" id="card" aria-live="polite"></section>
    </main>
    <aside><div class="panel" id="panel"></div></aside>
  </div>`;
  const key = STORE+'-info-'+id;
  try { if (localStorage.getItem(key)==='closed') $('#info').open = false; } catch(e) {}
  $('#info').addEventListener('toggle', e => { try { localStorage.setItem(key, e.target.open?'open':'closed'); } catch(err) {} });
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    cur.ex = b.dataset.ex; cur.streak = 0;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t===b));
    newQ();
  });
  renderPanel(); newQ();
}

const curEx = () => CAT[cur.cat].ex[cur.ex];
function newQ(){ cur.q = curEx().gen(); cur.done = false; drawQ(); }

function drawQ(){
  const e = curEx(), q = cur.q;
  $('#card').innerHTML = `
    <div class="card-head"><h3>${e.title}</h3><span class="streak">Serie: ${cur.streak} richtig in Folge</span></div>
    <p class="stem">${q.stem}</p>
    <div class="opts${q.grid?' grid2':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span class="val">${o.html}</span></button>`).join('')}</div>
    <div id="fb" hidden></div>
    <div class="hint" id="hintbox" hidden>${e.hint}</div>
    <div class="qbar"><button class="btn" id="hintbtn">Hilfe zeigen</button><button class="btn primary" id="next">Neue Aufgabe</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  $('#hintbtn').onclick = () => { const h = $('#hintbox'); h.hidden = !h.hidden; $('#hintbtn').textContent = h.hidden ? 'Hilfe zeigen' : 'Hilfe ausblenden'; };
  $('#next').onclick = newQ;
}

function scale(ph){
  const p = Math.max(0, Math.min(14, ph)); const x = (p/14*100).toFixed(1);
  return `<div class="mini" aria-hidden="true"><span class="lb" style="left:${x}%">pH ${num(ph)}</span><span class="mk" style="left:${x}%"></span></div>`;
}

function answer(i){
  if (cur.done) return; cur.done = true;
  const q = cur.q, chosen = q.options[i], ok = !!chosen.correct;
  document.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if (q.options[j].correct) b.classList.add('correct');
    else if (j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const item = q.item || curEx().item;
  const s = state.stats[item] || {r:0,t:0}; s.t++; if (ok) s.r++; state.stats[item] = s; save();
  cur.streak = ok ? cur.streak+1 : 0;
  document.querySelector('.streak').textContent = `Serie: ${cur.streak} richtig in Folge`;
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb'+(ok?'':' bad');
  fb.innerHTML = `<strong class="v">${ok?'Richtig.':'Nicht ganz.'}</strong>
    ${ok?'':`<p>${chosen.why||''}</p>`}
    <div class="sol">${q.sol}</div>
    ${typeof q.ph==='number'?scale(q.ph):''}`;
  $('#next').focus();
  renderPanel();
}

function renderPanel(){
  const C = CAT[cur.cat];
  const lv = [['up','kann ich','s-up'],['mid','teilweise','s-mid'],['down','noch nicht','s-down']];
  $('#panel').innerHTML = `<h3>Ich kann …</h3>${(C.order||Object.keys(C.items)).map(n=>{ const t = C.items[n];
    const s = state.stats[n] || {r:0,t:0}; const pct = s.t ? Math.round(s.r/s.t*100) : 0;
    return `<div class="item"><div class="txt"><b>${/^\d+$/.test(n)?n:'–'}</b>${t}</div>
      <div class="prog"><span class="track"><span class="fill" style="width:${pct}%;display:block"></span></span><span>${s.r}/${s.t} richtig</span></div>
      <div class="self">${lv.map(([k,l,c])=>`<button class="${c}" data-n="${n}" data-k="${k}" aria-pressed="${state.self[n]===k}">${l}</button>`).join('')}</div></div>`;
  }).join('')}
  <p class="where">Zum Nachlesen: ${C.where}</p>
  <button class="reset" id="reset">Fortschritt dieser Kategorie zurücksetzen</button>`;
  document.querySelectorAll('.self button').forEach(b => b.onclick = () => {
    state.self[b.dataset.n] = state.self[b.dataset.n]===b.dataset.k ? null : b.dataset.k; save(); renderPanel();
  });
  const r = $('#reset');
  r.onclick = () => {
    if (r.dataset.arm){ Object.keys(C.items).forEach(n => { delete state.stats[n]; delete state.self[n]; }); save(); renderPanel(); }
    else { r.dataset.arm = '1'; r.textContent = 'Wirklich löschen? Nochmal klicken'; setTimeout(()=>{ if (r.isConnected){ delete r.dataset.arm; r.textContent = 'Fortschritt dieser Kategorie zurücksetzen'; } }, 4000); }
  };
}

document.addEventListener('keydown', e => {
  if (!$('#card') || e.target.closest('input,textarea')) return;
  const idx = 'ABCD'.indexOf(e.key.toUpperCase());
  if (idx>=0 && !cur.done && cur.q && idx<cur.q.options.length) answer(idx);
});
$('#back').onclick = () => { location.hash = ''; };
function route(){ const id = location.hash.slice(1); CAT[id] ? renderCat(id) : renderHome(); }
window.addEventListener('hashchange', route);
route();
</script>
